# ============================================================
# Ada Platform - Docker Compose
# ============================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f app    # Follow app logs
#   docker compose down            # Stop all services
#   docker compose up -d --build   # Rebuild and restart
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ada-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ada-data:/app/app/data
      - ada-uploads:/app/uploads
      - ada-output:/app/output
      - ./templates:/app/templates:ro
      - ./frontend:/app/frontend:ro
    networks:
      - ada-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ada-data:
    driver: local
  ada-uploads:
    driver: local
  ada-output:
    driver: local

networks:
  ada-net:
    driver: bridge
