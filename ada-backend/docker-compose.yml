# ============================================================
# Ada Platform - Docker Compose
# ============================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f app    # Follow app logs
#   docker compose down            # Stop all services
#   docker compose up -d --build   # Rebuild and restart
# ============================================================

services:

  # --- Ada Backend API ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ada-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Persist protocol data between container restarts
      - ada-data:/app/app/data
      - ada-uploads:/app/uploads
      - ada-output:/app/output
      # Mount templates (read-only)
      - ./templates:/app/templates:ro
      # Mount frontend HTML (read-only)
      - ./frontend:/app/frontend:ro
    networks:
      - ada-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.25-alpine
    container_name: ada-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL with Let's Encrypt
      # - ./deploy/certs:/etc/nginx/certs:ro
      # - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ada-net

volumes:
  ada-data:
    driver: local
  ada-uploads:
    driver: local
  ada-output:
    driver: local

networks:
  ada-net:
    driver: bridge
