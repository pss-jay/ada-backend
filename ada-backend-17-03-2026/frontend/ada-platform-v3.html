        <h2>Dose Formulation Analysis</h2>
        <p>${d('TestMaterial.DoseFormulationAnalysis','Dose formulation analysis details')}</p>
        <h2>Test Material Inventory and Disposition</h2>
        <p>Records of receipt, distribution, storage, and disposition of test material(s) will be maintained. Unused material will be ${d('TestMaterial.TestMaterialInventoryAndDisposition','disposition instructions')}.</p>

        <!-- ============ TEST SYSTEM ============ -->
        <h1 id="ps6">Test System</h1>
        <table>
          <tr><th style="width:40%">Description</th><th>Value</th></tr>
          <tr><td>Species / Strain</td><td>${d('TestSystem.SpeciesStrain','Species/Strain')}</td></tr>
          <tr><td>Supplier</td><td>${d('TestSystem.Supplier','Supplier')}</td></tr>
          <tr><td>Condition</td><td>${d('TestSystem.Condition','Condition')}</td></tr>
          <tr><td>Method of Identification</td><td>${d('TestSystem.MethodofIdentification','Method of Identification')}</td></tr>
          <tr><td>Target Body Weight Range (at dosing initiation)</td><td>${d('TestSystem.TargetBodyWeightRange','X to X kg')}</td></tr>
          <tr><td>Target Age Range (at dosing initiation)</td><td>${d('TestSystem.TargetAgeRage','Age Range')}</td></tr>
          <tr><td>Number of Animals for Acclimation</td><td>${d('TestSystem.NumberofAnimalsforAcclimation','Animals for Acclimation')}</td></tr>
          <tr><td>Number of Animals for Dosing</td><td>${d('TestSystem.NumberofAnimalsforDosing','Animals for Dosing')}</td></tr>
        </table>

        <!-- ============ HUSBANDRY ============ -->
        <h1 id="ps7">Husbandry</h1>
        <h2>Housing</h2>
        <p>Animals will be ${sow('socially')} housed (same sex and dosing group together) in ${tpl('stainless steel with fiberglass slatted flooring or self-spanned PVC-coated expanded metal flooring')}. The primary enclosure complies with the Animal Welfare Act and recommendations set forth in the Guide for the Care and Use of Laboratory Animals (NRC 2011).</p>
        <h2>Environmental Conditions</h2>
        <p>Animals will be housed in a temperature-controlled and humidity-monitored environment. An automatic lighting system will be set to provide a 12-hour light/dark cycle, except during designated procedures.</p>
        <h2>Diet and Feeding</h2>
        <p>Animals will be fed an appropriate daily volume of ${tpl('Certified Teklad\u2122 8753C swine diet')}. Animals may be fasted as required for study-specific procedures.</p>
        <h2>Drinking Water</h2>
        <p>Drinking water will be provided ad libitum via on-site filtered deep well water source.</p>
        <h2>Enrichment</h2>
        <p>Treats and enrichment devices (such as floor toys) will be provided throughout the course of the study.</p>
        <h2>Veterinary Care</h2>
        <p>Veterinary care will be available throughout the course of the study and animals will be examined by veterinary staff as warranted by clinical signs or other changes.</p>

        <!-- ============ EXPERIMENTAL DESIGN ============ -->
        <h1 id="ps8">Experimental Design</h1>
        <p>Animals will be transferred to the study from a Testing Facility stock colony. Animals will be acclimated over a minimum period of ${sow('14 days')} prior to initiation of dosing.</p>
        <h2>Randomization and Animal Assignment</h2>
        <p>Animals will be randomly assigned to groups based on established social unit using a stratified randomization scheme incorporating mean body weight of social unit.</p>
        <p>Spare and/or replaced animals will be removed from the study after ${need('Day X')} and their disposition documented.</p>
        <h2>Companion Animals</h2>
        <p>Companion animals may be used during the study. These animals will be sourced from the Testing Facility stock colony to provide social housing for study animals.</p>
        <h2>Study Experimental Design</h2>
        ${(()=>{
          const ed=currentProtocolData?currentProtocolData.ExperimentalDesign:null;
          const groups=ed?(ed.StudyGroups||ed.study_groups||ed.Groups||[]):[];
          if(groups.length){
            return '<table><tr><th>Group</th><th>Test Material</th><th>Dose Level</th><th>Route</th><th>Animals</th></tr>'+
              groups.map((g,i)=>'<tr><td>'+(i+1)+'</td><td>'+sow(g.TestMaterial||g.test_material||g.name||'')+'</td><td>'+quest((g.DoseLevel||g.dose_level||g.dose||'')+(g.DoseUnit||g.unit||''))+'</td><td>'+sow(g.Route||g.route||getRoute()||'')+'</td><td>'+sow(g.Animals||g.animals||g.NumberOfAnimals||'')+'</td></tr>').join('')+'</table>';
          }
          return '<table><tr><th>Group</th><th>Test Material</th><th>Dose Level</th><th>Route</th><th>Animals</th></tr>'+
            '<tr><td>1</td><td>'+d('TestMaterial.VehicleControl1.Identification','Vehicle')+'</td><td>0</td><td>'+d('StudyInfo.Route','Route')+'</td><td>'+need('# per sex/group')+'</td></tr>'+
            '<tr><td>2-4</td><td>'+d('BasicDetails.TestArticleName','Test Article')+'</td><td>'+need('Low / Mid / High')+'</td><td>'+d('StudyInfo.Route','Route')+'</td><td>'+need('# per sex/group')+'</td></tr></table>';
        })()}
        <p style="font-size:.78rem;color:var(--muted)">${d('ExperimentalDesign.DosingFrequency','Dosing frequency details')}</p>
        <h2>Anesthesia and Analgesia Procedures</h2>
        <table>
          <tr><th style="width:25%">Procedure</th><th>Details</th></tr>
          <tr><td>Anesthesia</td><td>${tpl('Tiletamine/zolazepam (2-6 mg/kg, IM), xylazine (0.4-1.2 mg/kg, IM) and atropine (0.04-0.05 mg/kg, IM). For short procedures, animals may be induced and maintained with isoflurane via mask.')}</td></tr>
          <tr><td>Analgesia</td><td>${tpl('Buprenorphine extended-release (0.2-0.3 mg/kg, SC) and carprofen (2.2-4.4 mg/kg, SC or PO).')}</td></tr>
          <tr><td>Antibiotics</td><td>${tpl('Cefazolin (20 mg/kg, IV) and Excede\u00AE (5 mg/kg, IM).')}</td></tr>
        </table>
        <h2>Temporary Catheter Placement</h2>
        <p>${tpl('During the acclimation period, a temporary jugular catheter will be placed in each study animal for blood collection procedures.')}</p>
        <h2>Administration of Dose Formulations</h2>
        <p>The test article will be administered to appropriate animals by ${d('StudyInfo.Route','route of administration')} for ${d('BasicDetails.TestPeriod','dosing duration')}. ${d('TestMaterial.TestMaterialPreparation.TestArticleFormulation','Formulation preparation details')}.</p>

        <!-- ============ EXPERIMENTAL OBSERVATIONS AND PROCEDURES ============ -->
        <h1 id="ps9">Experimental Observations and Procedures</h1>
        <p>Experimental observations and measurements listed in the subsequent sections will be conducted for all animals, including spares as applicable.</p>
        <h2>Clinical Observations and Examinations</h2>
        <table>
          <tr><th style="width:30%">Procedure</th><th>Details</th></tr>
          <tr><td>Mortality/Moribundity Check</td><td>${quest('At least twice daily (AM and PM; with at least 4 hours between observations). If clinical signs are observed, an unscheduled DCO will be conducted.')}</td></tr>
          <tr><td>Food Evaluation</td><td>${tpl('Visual inspection for overall appetite concomitant with mortality/moribundity checks.')}</td></tr>
          <tr><td>Cage Side Observations</td><td>${sow('Once daily')}, beginning during acclimation.</td></tr>
          <tr><td>Detailed Clinical Observations</td><td>${sow('Once weekly')} throughout the study, including prior to necropsy.</td></tr>
          <tr><td>Veterinary Physical Examination</td><td>${tpl('Once during acclimation and once during Week')} ${need('X')}.</td></tr>
        </table>
        <h2>Body Weight</h2>
        <p>${quest('Twice weekly')}, beginning during acclimation (prior to randomization), then throughout the study including the day prior to necropsy. Terminal body weights collected on the day of scheduled necropsy for organ-to-body weight ratios.</p>
        <h2>Food Consumption</h2>
        <p>${sow('Daily')} food consumption measurement beginning on Day -1 (after randomization). Individual food consumption will be ${sow('qualitatively')} measured.</p>
        <h2>Ophthalmology</h2>
        <p>Once during ${sow('acclimation')} and during the last week of the ${sow('dosing')} period. ${sow('Week 6 to be added by amendment.')} Topical mydriatic (1% Tropicamide) will be administered. Both eyes examined using an indirect ophthalmoscope and slit lamp biomicroscope by a board-certified Ophthalmologist.</p>
        <h2>Electrocardiography</h2>
        <p>Once during ${sow('acclimation')} and once during ${sow('Week 4')} of the dosing period. ${sow('Week 6 to be added by amendment.')} Leads I, II, III, aVR, aVL, and aVF. From Lead II: RR interval, PR interval, QRS duration, QT interval and QTcB. Qualitative and quantitative evaluation by ${tpl('Larry P. Tilley, DVM, DACVIM')}.</p>

        <!-- ============ CLINICAL PATHOLOGY ============ -->
        <h1 id="ps10">Clinical Pathology</h1>
        <h2>Sample Collection</h2>
        <p>Animals will be fasted before serum chemistry collections (up to 24 hours) and during urine collection with access to water. Blood collected from an appropriate vein. Urine collected overnight from a urine collection pan.</p>
        <h2>Hematology</h2>
        <p>${sow('Standard panel')}: RBC count, hemoglobin, hematocrit, reticulocyte count, red cell distribution width, MCV, MCH, MCHC, platelet count, mean platelet volume, WBC count with differential (neutrophil, lymphocyte, monocyte, eosinophil, basophil, large unstained cell). Blood smear prepared but not examined unless to verify results.</p>
        <h2>Coagulation</h2>
        <p>${sow('Standard panel')}: Activated partial thromboplastin time, prothrombin time, fibrinogen.</p>
        <h2>Serum Chemistry</h2>
        <p>${sow('Standard panel')}: ALT, AST, creatine kinase, ALP, GGT, sorbitol dehydrogenase, total bilirubin, total protein, albumin, globulin, A/G ratio, glucose, total cholesterol, triglyceride, BUN, creatinine, inorganic phosphorus, calcium, potassium, sodium, chloride.</p>
        <h2>Urinalysis</h2>
        <p>${sow('Standard panel')}: Color, clarity, glucose, ketones, blood, protein, bilirubin, pH, volume, specific gravity.</p>
        <h2>Bone Marrow Smears Evaluation</h2>
        <p>${sow('Bone marrow smears prepared for all animals')}; examination may be added by amendment.</p>

        <!-- ============ LABORATORY ASSESSMENTS ============ -->
        <h1 id="ps11">Laboratory Assessments</h1>
        <h2>Sample Collection</h2>
        <p>Blood collected on ${sow('Days 1 and 28')}, Groups 1-4. ${sow('Up to 10 timepoints')} for Groups 2-4 per collection day; ${sow('1 timepoint')} for Group 1. Anticoagulant: ${quest('K\u2082EDTA')}.</p>
        <h2>Bioanalysis and Toxicokinetic Evaluation</h2>
        <h3>Bioanalytical Sample Processing and Analysis</h3>
        <table>
          <tr><th style="width:35%">Processing Detail</th><th>Value</th></tr>
          <tr><td>Centrifugation Initiation</td><td>${tpl('Within 60 minutes of collection')}</td></tr>
          <tr><td>Centrifugation Settings</td><td>${tpl('2000 x g, 4\u00B0C, 15 minutes')}</td></tr>
          <tr><td>Method of Analysis</td><td>${sow('LC-MS/MS')} at Altasciences</td></tr>
          <tr><td>Analysis Parameters</td><td>${d('BasicDetails.TestArticleName','Analyte')} ${need('method details')}</td></tr>
          <tr><td>Shipping</td><td>${quest('Batch shipment is acceptable')}</td></tr>
        </table>
        <h3>Toxicokinetic Evaluation</h3>
        <p>TK parameters estimated using ${sow('Phoenix\u00AE WinNonlin\u00AE')} (Certara). Noncompartmental approach consistent with the extravascular route of administration. Parameters include: T<sub>max</sub>, C<sub>max</sub>, C<sub>max</sub>/D, AUC<sub>last</sub>, AUC<sub>last</sub>/D, AUC<sub>0-24</sub>, AUC<sub>inf</sub>, T<sub>1/2</sub>, accumulation ratio (AR), metabolite ratio (MR).</p>
        <p>Half-life: ${quest('>200 hours')}.</p>
        <h2>Anti-Drug Antibody Sample Processing and Analysis</h2>
        <p>${need('ADA analysis details to be provided by Sponsor if applicable.')}</p>

        <!-- ============ TERMINAL PROCEDURES AND PATHOLOGY ============ -->
        <h1 id="ps12">Terminal Procedures and Pathology</h1>
        <table>
          <tr><th>Group(s)</th><th>Scheduled Euthanasia Day</th></tr>
          <tr><td>1 to 4 (Main animals)</td><td>${sow('Day 29')}</td></tr>
          <tr><td>1 to 4 (Recovery animals)</td><td>${sow('Day 42')}</td></tr>
        </table>
        <h2>Scheduled Euthanasia</h2>
        <p>Animals will be fasted overnight (not to exceed 24 hours). Terminal body weight collected. Animals euthanized by overdose of euthanasia solution following blood collection. Complete macroscopic examination and tissue collection.</p>
        <h2>Unscheduled Euthanasia</h2>
        <p>Euthanasia for humane reasons authorized by the Study Director or staff veterinarian after consultation with the Sponsor, when possible.</p>
        <h2>Found Dead</h2>
        <p>Animals found dead will not be weighed. Complete macroscopic examination; tissues collected as for scheduled euthanasia.</p>
        <h2>Organ Weights</h2>
        <p>Organ weights recorded from animals at scheduled necropsy only. Paired organs weighed together. Relative organ weights calculated as percentages of terminal body weight and brain weight. Organs listed in Appendix 1.</p>
        <h2>Tissue Collection and Preservation</h2>
        <p>Tissues listed in Appendix 1 will be collected and fixed in the appropriate fixative.</p>
        <h2>Histology and Histopathology</h2>
        <p>Histopathologic examination of ${sow('Groups 1 and 4 \u2014 full standard tissue list')}. Groups 2 and 3: tissues collected and preserved; processing may be added by amendment. Histopathologic examination by a board-certified veterinary pathologist.</p>
        <h2>Pathology Peer Review</h2>
        <p>${quest('Pathology Peer Review: Yes')}. A peer review including organ weights, gross pathology, and histopathology will be conducted by the Peer Review Pathologist at ${need('Add institution')}.</p>

        <!-- ============ DATA ANALYSES ============ -->
        <h1 id="ps13">Data Analyses</h1>
        <p>${sow('ANOVA/Bartlett\'s (Comparative)')} analysis. Numerical data collected on scheduled occasions will be summarized and statistically analyzed by sex and occasion. All inferential statistical tests conducted at the 5% significance level.</p>

        <!-- ============ COMPUTERIZED SYSTEMS ============ -->
        <h1 id="ps14">Computerized Systems and Analyzers</h1>
        <p>${tpl('The actual critical systems/analyzers used will be listed in the Final Report.')}</p>

        <!-- ============ ANIMAL CARE ============ -->
        <h1 id="ps15">Animal Care</h1>
        <p>${tpl('The Testing Facility is accredited by AAALAC International, has an Animal Welfare Assurance with OLAW (NIH), and is registered with the USDA.')}</p>

        <!-- ============ AMENDED PROTOCOLS AND DEVIATIONS ============ -->
        <h1 id="ps16">Amended Protocols and Deviations</h1>
        <p>Changes made to this Protocol will be documented as an Amended Protocol, signed and dated by the Study Director. All Protocol and SOP deviations will be documented in the study data.</p>

        <!-- ============ REPORTING ============ -->
        <h1 id="ps17">Reporting</h1>
        <p>${sow('Standard draft and final report')}. A draft report will be prepared after completion of the in-life phase. This report will be finalized following consultation with the Sponsor.</p>
        <p>${quest('Draft and Final CTD tables required. Target: July 31.')} A tabulated data summary following the appropriate format (ICH M4S(R2)) will be provided following issuance of the Draft and/or Final Report.</p>
        <p><strong>Submission Target:</strong> ${quest('Early August filing (IND-amendment to open IND in the US)')}</p>

        <!-- ============ SEND DATASETS ============ -->
        <h1 id="ps18">SEND Datasets</h1>
        <p>${quest('Draft SEND needed.')} SEND datasets will be generated at the Draft and/or Final Reports and will include ${sow('18 Domains')}.</p>
        <h3>Study Classification</h3>
        <table>
          <tr><th style="width:40%">Parameter</th><th>Value</th></tr>
          <tr><td>Study Category</td><td>${sow('TOX1')}</td></tr>
          <tr><td>Study Type</td><td>${need('Choose item')}</td></tr>
          <tr><td>Study Design</td><td>${need('Choose item')}</td></tr>
          <tr><td>Administration Dose Form</td><td>${sow('Oral (tablet)')}</td></tr>
        </table>

        <!-- ============ ARCHIVAL STORAGE ============ -->
        <h1 id="ps19">Archival Storage</h1>
        <p>Upon study completion, all materials generated by the Testing Facility will be archived at ${tpl('Altasciences Preclinical Columbia, LLC')}. After ${sow('1 year')} following shipment of the final report, the Sponsor will be contacted regarding continued maintenance of the archive.</p>

        <!-- ============ APPENDIX 1 ============ -->
        <h1 id="ps20">Appendix 1 &mdash; Tissue Collections and Preservation</h1>
        <p>${tpl('Standard tissue list for swine (per template). Full tissue list including adrenals, aorta, bone marrow, brain, eyes, GI tract, heart, kidneys, liver, lungs, lymph nodes, ovaries/testes, pancreas, pituitary, prostate/uterus, salivary glands, sciatic nerve, skeletal muscle, skin, spinal cord, spleen, sternum, thymus, thyroid/parathyroid, trachea, urinary bladder, and gross lesions.')}</p>

        <!-- ============ APPENDIX 2 ============ -->
        <h1 id="ps21">Appendix 2 &mdash; Study Design Guidance</h1>
        <p>Species: ${d('TestSystem.SpeciesStrain','Species')} ${need('Species justification and dose rationale')}.</p>

        <!-- ============ APPROVALS ============ -->
        <h1 id="ps22">Approvals</h1>
        <p>Approval from the Sponsor's representative was received on ${need('DD Mmm YYYY')}.</p>
        <table>
          <tr><th>Role</th><th>Signature / Date</th></tr>
          <tr><td>Study Director</td><td>${need('Signature, DD Mmm YYYY')}</td></tr>
          <tr><td>Testing Facility Management</td><td>${need('Signature, DD Mmm YYYY')}</td></tr>
          <tr><td>Sponsor Representative</td><td>${need('Signature, DD Mmm YYYY')}</td></tr>
        </table>

      </div>
      ${chatOpen?`<!-- Ada Chat Panel -->
      <div style="border-left:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;height:100%">
        <div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
          <span style="font-size:1.1rem">\uD83E\uDD16</span>
          <div>
            <div style="font-weight:700;font-size:.82rem">Ada Protocol Assistant</div>
            <div style="font-size:.68rem;color:var(--muted)">Ask about any section, get suggestions, check compliance</div>
          </div>
        </div>
        <div style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px">
          <div style="padding:10px 12px;background:rgba(0,152,102,.06);border-radius:10px 10px 10px 2px;font-size:.76rem;line-height:1.5;color:var(--txt)">
            <strong>Ada:</strong> I\u2019m ready to help with Protocol ${getStudyNumber()||currentProtocolId||''}. You can ask me to:
            <div style="margin-top:6px;font-size:.72rem;color:var(--muted)">
              \u2022 Rewrite or expand any section<br>
              \u2022 Check GLP compliance<br>
              \u2022 Compare with similar past protocols<br>
              \u2022 Suggest content for empty fields<br>
              \u2022 Flag inconsistencies across sections
            </div>
          </div>
          ${activeS>=0?`<div style="padding:10px 12px;background:rgba(0,87,191,.06);border-radius:10px 10px 10px 2px;font-size:.76rem;line-height:1.5">
            <strong>Ada:</strong> You\u2019re viewing <strong>${tocItems[activeS]}</strong>. ${sectionStatus[activeS].status==='needs-input'?'This section has fields that need input. Want me to suggest values based on the SOW and similar past protocols?':'This section looks complete. Want me to review it for compliance or consistency?'}
          </div>`:''}
          <div style="padding:8px 12px;background:#fff;border-radius:2px 10px 10px 10px;font-size:.76rem;border:1px solid var(--border)">
            <strong style="color:var(--research)">You:</strong> Can you check the Experimental Design section for consistency with the SOW?
          </div>
          <div style="padding:10px 12px;background:rgba(0,152,102,.06);border-radius:10px 10px 10px 2px;font-size:.76rem;line-height:1.5">
            <strong>Ada:</strong> Checking Experimental Design against the SOW...<br><br>
            <span style="color:var(--g2)">\u2713</span> Group allocation matches SOW (3a+2b per sex/group)<br>
            <span style="color:var(--g2)">\u2713</span> Dose levels match questionnaire (3, 10, 30 mg/head)<br>
            <span style="color:var(--g2)">\u2713</span> Route matches SOW (oral tablet, once daily)<br>
            <span style="color:#f0ab00">\u26A0</span> <strong>Note:</strong> Questionnaire says <em>\u201Cdose levels subject to change.\u201D</em> Flag for sponsor confirmation?
          </div>
        </div>
        <div style="padding:10px;border-top:1px solid var(--border)">
          <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
            ${['Review this section','Suggest missing fields','Check GLP compliance','Compare to past protocols'].map(q=>`<button class="btn btn-s" style="font-size:.62rem;padding:3px 8px;border-radius:12px" onclick="toast('Ada is analyzing...')">${q}</button>`).join('')}
          </div>
          <div style="display:flex;gap:6px">
            <input type="text" placeholder="Ask Ada about this protocol..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.78rem;outline:none" onfocus="this.style.borderColor='var(--g2)'" onblur="this.style.borderColor='var(--border)'">
            <button class="btn btn-p" style="font-size:.78rem;padding:8px 14px" onclick="toast('Ada is thinking...')">Send</button>
          </div>
        </div>
      </div>`:''}
    </div>
  </div>`;
  c.appendChild(page);
  setTimeout(()=>initEditorSections(),50);
}

/* ===== GENERIC FEATURE GRID ===== */
function featureGrid(items,cols=2){
  return `<div class="${cols===3?'feature-grid tri':'feature-grid'}">${items.map(it=>`<div class="card feature-card fade-up" style="border-left:4px solid ${it.color||'var(--g2)'}"><div style="font-size:1.5rem;margin-bottom:10px">${it.ico}</div><h4 style="font-weight:700;font-size:.92rem;margin-bottom:6px">${it.t}</h4><p style="font-size:.8rem;color:var(--muted);line-height:1.5">${it.d}</p></div>`).join('')}</div>`;
}

/* ===== TABS BUILDER ===== */
function tabsHTML(tabs,active,setter){
  return `<div class="tabs">${tabs.map(t=>`<button class="${t.id===active?'active':''}" onclick="${setter}('${t.id}')">${t.label}</button>`).join('')}</div>`;
}

function setAltabotTab(t){altabotTab=t;navigate('altabot')}
function renderAltabot(c){
  const page=h('div',{className:'page'});
  page.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px"><div><h2 style="font-size:1.3rem;font-weight:800">AltaBot Clinicals</h2><p style="color:var(--muted);font-size:.85rem">RAG-powered clinical authoring \u2014 Protocol drafting, ICF generation, cross-document QC</p></div><span class="badge bg-coral">V2 \u2014 Clinical Trials</span></div>`;
  page.innerHTML+=tabsHTML([{id:'ingest',label:'Ingest'},{id:'draft',label:'Draft'},{id:'map',label:'Map'},{id:'generate',label:'ICF Gen'},{id:'validate',label:'QC Checks'},{id:'review',label:'Review'}],altabotTab,'setAltabotTab');

  const panel=h('div',{className:'card',style:{padding:'32px',minHeight:'400px'}});
  if(altabotTab==='ingest'){

/* ===== CHAT ===== */
function renderChat(c){
  const wrap=h('div',{className:'chat-layout'});

  // Sidebar
  const sb=h('div',{className:'chat-sidebar'});
  sb.innerHTML=`<div style="padding:16px;border-bottom:1px solid var(--border)"><button class="btn btn-p" style="width:100%;justify-content:center" onclick="newChat()">+ New Chat</button></div>`;
  const list=h('div',{style:{flex:'1',overflowY:'auto',padding:'8px'}});
  const chatIds=Object.keys(chatHistories).map(Number).sort((a,b)=>b-a);
  chatIds.forEach(id=>{
    const ch=chatHistories[id];
    const btn=h('button',{style:{width:'100%',padding:'10px 12px',borderRadius:'8px',textAlign:'left',marginBottom:'4px',background:selectedChat===id?'rgba(0,152,102,.06)':'transparent',border:'none',cursor:'pointer',fontFamily:'inherit'},onclick:()=>{selectedChat=id;chatMsgs=chatHistories[id].msgs;navigate('chat')}});
    btn.innerHTML=`<div style="font-weight:${selectedChat===id?600:400};font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ch.title}</div><div style="font-size:.7rem;color:var(--muted);margin-top:2px">${ch.time} \u00B7 ${ch.msgs.length} messages</div>`;
    list.appendChild(btn);
  });
  sb.appendChild(list);wrap.appendChild(sb);

  // Main
  const main=h('div',{className:'chat-main'});
  const msgs=h('div',{className:'chat-messages',id:'chat-msgs'});

  if(chatMsgs.length===0){
    // Empty state welcome
    const welcome=h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:'1',padding:'40px 20px',textAlign:'center'}});
    welcome.innerHTML=`<div style="font-size:2.8rem;margin-bottom:12px">\uD83E\uDDE0</div>
      <h3 style="font-weight:700;font-size:1.15rem;margin-bottom:6px;color:var(--g3)">Start a new conversation with Ada</h3>
      <p style="color:var(--muted);font-size:.85rem;max-width:420px;line-height:1.5;margin-bottom:24px">Ask me about study status, protocol generation, GLP compliance, dosing calculations, SEND datasets, and more.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px">${ADA_SUGGESTIONS.map(sq=>'<button style="padding:8px 16px;font-size:.78rem;border-radius:20px;border:1.5px solid rgba(0,152,102,.25);background:rgba(0,152,102,.04);color:var(--g3);cursor:pointer;font-family:inherit;transition:all .2s" onmouseover="this.style.background=\'rgba(0,152,102,.12)\';this.style.borderColor=\'var(--g2)\'" onmouseout="this.style.background=\'rgba(0,152,102,.04)\';this.style.borderColor=\'rgba(0,152,102,.25)\'" onclick="askAda(\''+sq.replace(/'/g,"\\'")+'\')">' + sq + '</button>').join('')}</div>`;
    msgs.appendChild(welcome);
  } else {
    chatMsgs.forEach((m,i)=>{
      const bubble=h('div',{className:`msg ${m.from==='user'?'msg-user':'msg-ada'}`,style:{animationDelay:i*.1+'s'}});
      if(m.from==='ada')bubble.innerHTML=`<div style="font-weight:700;font-size:.75rem;color:var(--g2);margin-bottom:4px">Ada AI</div>`;
      bubble.appendChild(document.createTextNode(m.text));
      msgs.appendChild(bubble);
    });
  }
  main.appendChild(msgs);

  // Suggested questions (shown below messages when chat has history)
  if(chatMsgs.length>0){
    const sugWrap=h('div',{style:{padding:'10px 16px 0',display:'flex',flexWrap:'wrap',gap:'6px'}});
    const sugLabel=h('div',{style:{width:'100%',fontSize:'.72rem',fontWeight:'600',color:'var(--muted)',marginBottom:'2px',textTransform:'uppercase',letterSpacing:'.5px'}});
    sugLabel.textContent='\u2728 Suggested Questions';
    sugWrap.appendChild(sugLabel);
    const shuffled=ADA_SUGGESTIONS.slice().sort(()=>Math.random()-.5).slice(0,4);
    shuffled.forEach(sq=>{
      const chip=h('button',{style:{padding:'6px 12px',fontSize:'.75rem',borderRadius:'20px',border:'1px solid rgba(0,152,102,.25)',background:'rgba(0,152,102,.04)',color:'var(--g3)',cursor:'pointer',fontFamily:'inherit',transition:'all .2s',whiteSpace:'nowrap',maxWidth:'100%',overflow:'hidden',textOverflow:'ellipsis'},onclick:()=>askAda(sq)});
      chip.textContent=sq;
      chip.onmouseenter=()=>{chip.style.background='rgba(0,152,102,.1)';chip.style.borderColor='var(--g2)'};
      chip.onmouseleave=()=>{chip.style.background='rgba(0,152,102,.04)';chip.style.borderColor='rgba(0,152,102,.25)'};
      sugWrap.appendChild(chip);
    });
    main.appendChild(sugWrap);
  }

  const inputBar=h('div',{className:'chat-input-bar'});
  const inp=h('input',{placeholder:'Ask Ada anything about your studies...',id:'chat-inp'});
  inp.onkeydown=e=>{if(e.key==='Enter')sendChat()};
  inputBar.appendChild(inp);
  const sendBtn=h('button',{className:'btn btn-p',onclick:sendChat,innerHTML:'Send'});
  inputBar.appendChild(sendBtn);
  main.appendChild(inputBar);

  wrap.appendChild(main);c.appendChild(wrap);
  setTimeout(()=>{const el=document.getElementById('chat-msgs');if(el)el.scrollTop=el.scrollHeight},100);
}

nted with NAM weight-of-evidence. This extends to biologics, then NCEs. NAM Studio positions Altasciences ahead of this curve.\n\nCurrent Status: In development, beta Q3 2027. Early access pilots with 2 Sponsors.\n\nWant to see how NAM data could optimize your current swine study design?"},

function matchAdaResponse(input){
  const lower=input.toLowerCase();
  for(const qa of ADA_QA){
    if(qa.keys.some(k=>lower.includes(k))) return qa.a;
  }
  return null;
}

function newChat(){
  const id=chatNextId++;
  const now=new Date();
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const timeLabel=months[now.getMonth()]+' '+now.getDate();
  chatHistories[id]={title:'New conversation',time:timeLabel,msgs:[]};
  selectedChat=id;
  chatMsgs=chatHistories[id].msgs;
  toast('New conversation started');
  navigate('chat');
}

function askAda(q){
  const inp=document.getElementById('chat-inp');
  if(inp) inp.value=q;
  sendChat();
}

function sendChat(){
  const inp=document.getElementById('chat-inp');
  if(!inp||!inp.value.trim())return;
  const q=inp.value;inp.value='';
  chatMsgs.push({from:'user',text:q});
  // Update chat title from first user message if it's still default
  const cur=chatHistories[selectedChat];
  if(cur&&cur.title==='New conversation'){
    cur.title=q.length>35?q.slice(0,35)+'\u2026':q;
  }
  navigate('chat');
  setTimeout(()=>{
    const matched=matchAdaResponse(q);
    if(matched){
      chatMsgs.push({from:'ada',text:matched});
    } else {
      chatMsgs.push({from:'ada',text:"I'm analyzing your request about \""+q.slice(0,50)+"...\"\n\nBased on our database and current protocols:\n\u2022 Cross-referenced 47 similar historical studies\n\u2022 Identified 3 relevant template variations\n\u2022 Compliance score: 94.2%\n\nWould you like me to generate a detailed report?"});
    }
    navigate('chat');
  },1200);
}

/* ===== ADA COGNITIVE SEARCH ===== */
let searchFilters={species:[],status:[],sponsor:[]};
let searchQuery='';
let _searchProtocols=null; // cached from backend
let _searchLoading=false;
let _searchDetailId=null; // if set, show protocol detail view
let _searchHistoryId=null; // if set, show change history view
let _searchHistoryData=null;
let _searchVersionsData=null;
let _searchAmendmentsData=null;
let _searchHistoryView='summary'; // 'summary' or 'detail'

async function loadSearchProtocols(force){
  if(_searchProtocols&&!force)return _searchProtocols;
  if(!backendConnected){_searchProtocols=[];return _searchProtocols;}
  _searchLoading=true;
  try{
    const r=await apiCall('/api/protocols',{method:'GET'});
    _searchProtocols=r.protocols||[];
  }catch(e){
    console.error('Failed to load protocols:',e);
    _searchProtocols=[];
  }
  _searchLoading=false;
  return _searchProtocols;
}

function getFilteredProtocols(){
  if(!_searchProtocols)return[];
  return _searchProtocols.filter(p=>{
    if(searchQuery){
      const q=searchQuery.toLowerCase();
      const hay=(p.study_number+' '+p.title+' '+p.sponsor+' '+p.species+' '+p.protocol_id+' '+p.filename).toLowerCase();
      if(!hay.includes(q))return false;
    }
    if(searchFilters.species.length){
      const sp=(p.species||'').toLowerCase();
      if(!searchFilters.species.some(f=>sp.includes(f.toLowerCase())))return false;
    }
    if(searchFilters.status.length&&!searchFilters.status.includes(p.display_status))return false;
    if(searchFilters.sponsor.length&&!searchFilters.sponsor.includes(p.sponsor))return false;
    return true;
  });
}

function toggleFilter(group,val){
  const arr=searchFilters[group];
  const idx=arr.indexOf(val);
  if(idx>-1)arr.splice(idx,1);else arr.push(val);
  navigate('search');
}
function doSearch(q){searchQuery=q;navigate('search');}

function statusColor(s){
  if(!s)return 'var(--muted)';
  const sl=s.toLowerCase();
  if(sl==='draft'||sl.includes('pending'))return '#e67e22';
  if(sl==='updated'||sl.includes('modified'))return '#3498db';
  if(sl==='final'||sl==='completed')return '#27ae60';
  if(sl.includes('amendment'))return '#9b59b6';
  return 'var(--g2)';
}
function statusBadgeClass(s){
  if(!s)return'';
  const sl=s.toLowerCase();
  if(sl==='draft'||sl.includes('pending'))return 'bg-orange';
  if(sl==='updated'||sl.includes('modified'))return 'bg-blue';
  if(sl==='final'||sl==='completed')return 'bg-green';
  if(sl.includes('amendment'))return 'bg-purple';
  return 'bg-green';
}

function renderSearch(c){
  const page=h('div',{className:'page'});

  if(_searchHistoryId){renderSearchHistory(page);c.appendChild(page);return;}

  if(_searchDetailId){renderSearchDetail(page);c.appendChild(page);return;}

  // Load protocols from backend on first render

    loadSearchProtocols().then(()=>navigate('search'));
    page.innerHTML=`<div style="text-align:center;padding:80px 20px;color:var(--muted)"><div class="spinner" style="margin:0 auto 16px"></div><p>Loading protocols from Ada...</p></div>`;

  // Header

    <p style="color:var(--muted);font-size:.85rem;margin-bottom:20px">Find protocols by study number, sponsor, species, or status. Click to view protocol details, version history, and amendments.</p>`;

  // Search bar
  const hasFilters=searchQuery||searchFilters.species.length||searchFilters.status.length||searchFilters.sponsor.length;
  page.innerHTML+=`<div class="card fade-up" style="padding:16px 20px;margin-bottom:20px">

        <input id="search-input" placeholder="Search by study number, sponsor, species, title..." value="${searchQuery}" style="border:none;background:transparent;font-size:.9rem;flex:1;color:var(--txt)" onkeydown="if(event.key==='Enter')doSearch(this.value)">

  // Summary cards
  const draftCnt=filtered.filter(p=>p.display_status==='Draft').length;
  const updCnt=filtered.filter(p=>p.display_status==='Updated').length;
  const finalCnt=filtered.filter(p=>p.display_status==='Final').length;
  const amendCnt=filtered.filter(p=>p.display_status.includes('Amendment')).length;

  page.innerHTML+=`<div class="breakdown-grid fade-up d1">
    <div class="breakdown-card" style="cursor:pointer" onclick="searchFilters.status=[];navigate('search')"><div class="num" style="color:var(--g2)">${filtered.length}</div><div class="lbl">Total Protocols</div></div>
    <div class="breakdown-card" style="cursor:pointer" onclick="searchFilters.status=['Draft'];navigate('search')"><div class="num" style="color:#e67e22">${draftCnt}</div><div class="lbl">Draft</div></div>
    <div class="breakdown-card" style="cursor:pointer" onclick="searchFilters.status=['Updated'];navigate('search')"><div class="num" style="color:#3498db">${updCnt}</div><div class="lbl">Updated</div></div>
    <div class="breakdown-card" style="cursor:pointer" onclick="searchFilters.status=['Final'];navigate('search')"><div class="num" style="color:#27ae60">${finalCnt}</div><div class="lbl">Final</div></div>
  </div>`;

  // Facets + Results grid
  let facetsHTML=`<div class="facet-panel">`;

  // Status facet
  const statuses=['Draft','Updated','Final'];
  const allStatuses=[...new Set((_searchProtocols||[]).map(p=>p.display_status))];
  allStatuses.forEach(s=>{if(!statuses.includes(s))statuses.push(s)});
  facetsHTML+=`<div class="card" style="padding:14px;margin-bottom:12px"><div class="facet-group"><h4>Status</h4>
    ${statuses.map(s=>{const cnt=(_searchProtocols||[]).filter(p=>p.display_status===s).length;const act=searchFilters.status.includes(s);return cnt?`<div class="facet-item ${act?'active':''}" onclick="toggleFilter('status','${s}')"><div class="facet-check">${act?'\u2713':''}</div><span style="color:${statusColor(s)};font-weight:600">${s}</span><span class="facet-count">${cnt}</span></div>`:''}).join('')}
  </div></div>`;

  // Species facet
  const allSpecies=[...new Set((_searchProtocols||[]).map(p=>(p.species||'unknown')))].filter(Boolean);
  if(allSpecies.length){
    facetsHTML+=`<div class="card" style="padding:14px;margin-bottom:12px"><div class="facet-group"><h4>Species</h4>
      ${allSpecies.map(sp=>{const cnt=(_searchProtocols||[]).filter(p=>p.species===sp).length;const act=searchFilters.species.includes(sp);return `<div class="facet-item ${act?'active':''}" onclick="toggleFilter('species','${sp}')"><div class="facet-check">${act?'\u2713':''}</div>${speciesEmoji(sp)} ${sp}<span class="facet-count">${cnt}</span></div>`}).join('')}
    </div></div>`;
  }

  // Sponsor facet
  const allSponsors=[...new Set((_searchProtocols||[]).map(p=>p.sponsor).filter(Boolean))];
  if(allSponsors.length){
    facetsHTML+=`<div class="card" style="padding:14px;margin-bottom:12px"><div class="facet-group"><h4>Sponsor</h4>
      ${allSponsors.map(s=>{const cnt=(_searchProtocols||[]).filter(p=>p.sponsor===s).length;const act=searchFilters.sponsor.includes(s);return `<div class="facet-item ${act?'active':''}" onclick="toggleFilter('sponsor','${s}')"><div class="facet-check">${act?'\u2713':''}</div>${s}<span class="facet-count">${cnt}</span></div>`}).join('')}
    </div></div>`;
  }
  facetsHTML+=`</div>`;

  // Results
  let resultsHTML=`<div>`;
  resultsHTML+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:.85rem;font-weight:600">${filtered.length} protocol${filtered.length!==1?'s':''} found</span></div>`;

  if(filtered.length===0){
    resultsHTML+=`<div style="text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:2.5rem;margin-bottom:12px">\uD83D\uDD0D</div><p style="font-weight:600;margin-bottom:4px">No protocols match your search</p><p style="font-size:.82rem">Try adjusting your query or clearing filters. If no protocols exist yet, upload a SOW to create one.</p></div>`;
  } else {
    filtered.forEach(p=>{
      const vLabel=p.latest_version||'v0.1';
      const amendLabel=p.amendment_count>0?`<span class="badge bg-purple" style="font-size:.7rem;margin-left:6px">${p.amendment_count} Amendment${p.amendment_count>1?'s':''}</span>`:'';
      resultsHTML+=`<div class="search-result" style="cursor:pointer" onclick="openSearchProtocol('${p.protocol_id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span class="badge" style="background:var(--g2)20;color:var(--g2)">Protocol</span>
              <span style="font-size:.78rem;font-weight:600;color:var(--txt)">${p.study_number||p.protocol_id}</span>
              <span style="font-size:.72rem;color:var(--muted)">${vLabel}</span>
              ${amendLabel}
            </div>
            <h4 style="font-weight:700;font-size:.9rem;margin-bottom:4px;line-height:1.3">${p.title||'Untitled Protocol'}</h4>
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">
              ${p.species?`<span style="font-size:.78rem;color:var(--muted)">${speciesEmoji(p.species)} ${p.species}</span>`:''}
              ${p.sponsor?`<span style="font-size:.78rem;color:var(--muted)">${p.sponsor}</span>`:''}
              <span style="font-size:.78rem;color:var(--muted)">${p.version_count} version${p.version_count!==1?'s':''}</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            <span class="badge ${statusBadgeClass(p.display_status)}">${p.display_status}</span>
            <div style="display:flex;gap:6px">
              <button class="btn btn-s" style="font-size:.72rem;padding:4px 10px" onclick="event.stopPropagation();showChangeHistory('${p.protocol_id}')">History</button>
              <button class="btn btn-p" style="font-size:.72rem;padding:4px 10px" onclick="event.stopPropagation();goToProtocol('${p.protocol_id}')">Open</button>
            </div>
          </div>
        </div>
      </div>`;
    });
  }
  resultsHTML+=`</div>`;

  page.innerHTML+=`<div class="search-container">${facetsHTML}${resultsHTML}</div>`;
  c.appendChild(page);
}

function renderHistorySummary(page){
  const versions=_searchVersionsData||[];
  const amendments=_searchAmendmentsData||[];

  // Build combined timeline
  let timeline=[];
  versions.forEach(v=>{
    timeline.push({type:'version',version:v.version,status:v.status||'Draft',author:v.author||'',label:v.label||'',timestamp:v.timestamp||'',fields:v.field_count||0});
  });
  amendments.forEach((a,i)=>{
    timeline.push({type:'amendment',number:a.amendment_number||i+1,status:a.status||'Active',author:a.author||'',label:a.reason||a.label||'Amendment',timestamp:a.timestamp||''});
  });
  timeline.sort((a,b)=>new Date(a.timestamp||0)-new Date(b.timestamp||0));

  if(timeline.length===0){
    page.innerHTML+=`<div class="card" style="padding:40px;text-align:center;color:var(--muted)"><p style="font-weight:600">No version history yet</p><p style="font-size:.82rem">Versions are created when protocol data is extracted or edited.</p></div>`;
    return;
  }

  // Summary stats
  page.innerHTML+=`<div class="breakdown-grid fade-up d1">
    <div class="breakdown-card"><div class="num" style="color:var(--g2)">${versions.length}</div><div class="lbl">Versions</div></div>
    <div class="breakdown-card"><div class="num" style="color:#9b59b6">${amendments.length}</div><div class="lbl">Amendments</div></div>
    <div class="breakdown-card"><div class="num" style="color:var(--research)">${timeline.length}</div><div class="lbl">Total Changes</div></div>
    <div class="breakdown-card"><div class="num" style="font-size:.9rem;color:var(--muted)">${timeline.length>0?new Date(timeline[timeline.length-1].timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'N/A'}</div><div class="lbl">Last Changed</div></div>
  </div>`;

  // Timeline
  page.innerHTML+=`<div class="card fade-up d2" style="padding:20px">
    <h3 style="font-weight:700;font-size:1rem;margin-bottom:16px">Version Timeline</h3>
    <div style="position:relative;padding-left:28px;border-left:2px solid var(--border)">
      ${timeline.map((t,i)=>{
        const isAmend=t.type==='amendment';
        const dotColor=isAmend?'#9b59b6':t.status==='Final'?'#27ae60':t.status==='Draft'?'#e67e22':'#3498db';
        const icon=isAmend?'<span style="font-size:.72rem;font-weight:700;color:#9b59b6">AMEND</span>':'<span style="font-size:.72rem;font-weight:700;color:'+dotColor+'">'+t.version+'</span>';
        const ts=t.timestamp?new Date(t.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
        return `<div style="position:relative;margin-bottom:18px;padding-bottom:${i<timeline.length-1?'18px':'0'};${i<timeline.length-1?'border-bottom:1px solid var(--border)08':''}">
          <div style="position:absolute;left:-34px;top:2px;width:12px;height:12px;border-radius:50%;background:${dotColor};border:2px solid white;box-shadow:0 0 0 2px ${dotColor}30"></div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
            <div style="display:flex;align-items:center;gap:8px">
              ${icon}
              <span class="badge ${isAmend?'bg-purple':statusBadgeClass(t.status)}" style="font-size:.68rem">${isAmend?'Amendment '+(t.number||''):t.status}</span>
            </div>
            <span style="font-size:.72rem;color:var(--muted)">${ts}</span>
          </div>
          <p style="font-size:.82rem;margin-top:2px">${t.label}</p>
          <p style="font-size:.75rem;color:var(--muted);margin-top:2px">by ${t.author||'System'}</p>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderHistoryDetail(page){
  const auditLog=Array.isArray(_searchHistoryData)?_searchHistoryData:[];

  if(auditLog.length===0){
    page.innerHTML+=`<div class="card" style="padding:40px;text-align:center;color:var(--muted)"><p style="font-weight:600">No detailed audit log available</p><p style="font-size:.82rem">Detailed change records are created when protocol fields are modified, versions are created, or documents are uploaded.</p></div>`;
    return;
  }

  page.innerHTML+=`<div class="card fade-up" style="padding:20px">
    <h3 style="font-weight:700;font-size:1rem;margin-bottom:16px">Audit Log <span style="font-size:.78rem;font-weight:400;color:var(--muted)">(${auditLog.length} entries)</span></h3>
    <table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <thead>
        <tr style="border-bottom:2px solid var(--border);text-align:left">
          <th style="padding:8px 12px;font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase">Timestamp</th>
          <th style="padding:8px 12px;font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase">Action</th>
          <th style="padding:8px 12px;font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase">Author</th>
          <th style="padding:8px 12px;font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase">Details</th>
        </tr>
      </thead>
      <tbody>
        ${auditLog.map(e=>{
          const ts=e.timestamp?new Date(e.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
          const action=(e.action||'').replace(/_/g,' ');
          const details=e.details?Object.entries(e.details).map(([k,v])=>`<span style="color:var(--muted)">${k}:</span> ${typeof v==='object'?JSON.stringify(v):v}`).join(', '):'';
          const actionColor=action.includes('created')?'#27ae60':action.includes('upload')?'#3498db':action.includes('delete')||action.includes('reject')?'#e74c3c':'var(--txt)';
          return `<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:8px 12px;white-space:nowrap;color:var(--muted);font-size:.78rem">${ts}</td>
            <td style="padding:8px 12px"><span style="color:${actionColor};font-weight:600;text-transform:capitalize">${action}</span></td>
            <td style="padding:8px 12px;font-size:.78rem">${e.author||'System'}</td>
            <td style="padding:8px 12px;font-size:.78rem;max-width:300px;overflow:hidden;text-overflow:ellipsis">${details}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function deployTemplate(){
  const spObj=TB_SPECIES.find(s=>s.id===tbSpecies)||{label:''};
  const siteObj=TB_SITES.find(s=>s.id===tbSite)||{label:''};
  // Show the bell notification dot
  const bellDot=document.querySelector('.notif-dot');
  if(bellDot)bellDot.style.display='block';
  // Push notification
  tbNotifications.push({species:spObj.label,site:siteObj.label,date:new Date().toLocaleDateString(),user:'Kevin Bowman'});
  toast(spObj.label+' template deployed to '+siteObj.label+' \u2014 notifications sent!');
  // Reset and go back to step 0
  setTimeout(()=>{tbStep=0;tbSpecies='';tbSite='global';tbSchedule='immediate';navigate('templateBuilder');},1500);
}

function renderSettings(c){
  const page=h('div',{className:'page'});
  page.innerHTML=`<h2 style="font-size:1.3rem;font-weight:800;margin-bottom:24px">Settings</h2>
  ${[{t:'Profile',fields:[{l:'Name',v:'Kevin Bowman'},{l:'Email',v:'kevin@altasciences.com'},{l:'Role',v:'Admin'}]},{t:'Notifications',fields:[{l:'Protocol generated',v:'toggle'},{l:'SOW upload complete',v:'toggle'},{l:'Study status changes',v:'toggle'},{l:'Compliance alerts',v:'toggle'}]},{t:'Integrations',fields:[{l:'Compass',v:'Connected'},{l:'AskAlbert',v:'Connected'},{l:'ChromaDB',v:'Active'},{l:'MongoDB',v:'Active'}]}].map(s=>`<div class="card settings-section" style="padding:20px"><h3 style="font-weight:700;font-size:.95rem;margin-bottom:14px">${s.t}</h3>${s.fields.map(f=>`<div class="setting-row"><span style="font-size:.85rem;color:var(--muted)">${f.l}</span>${f.v==='toggle'?'<div class="toggle"></div>':`<span style="font-size:.85rem;font-weight:500;color:${f.v==='Connected'||f.v==='Active'?'var(--g2)':'var(--txt)'}">${f.v}</span>`}</div>`).join('')}</div>`).join('')}`;
  c.appendChild(page);
}
