<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ada — AI-Powered Operations Platform | Altasciences</title>
<style>
/* Google Fonts - graceful fallback to system fonts if unavailable */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --g1:#7ec681;--g2:#009866;--g3:#005246;
  --preclinical:#f0ab00;--clinical:#e0684b;--bio:#00c0b5;--mfg:#8131b0;--research:#0057bf;
  --bg:#f4f7fa;--card:#fff;--txt:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;
  --shadow:0 4px 24px rgba(0,82,70,.08);--shadow-lg:0 12px 48px rgba(0,82,70,.12);
  --r:16px;--rs:10px;--gradient:linear-gradient(135deg,#005246,#009866,#7ec681);
}
html{font-size:15px}
body{font-family:'Inter',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;height:100vh}
input,button,textarea,select{font-family:inherit;outline:none}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(0,152,102,.2);border-radius:3px}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes typeDot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes growWidth{from{width:0}}
@keyframes countPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

.fade-up{animation:fadeUp .5s ease both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border);transition:all .3s}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.btn{padding:10px 24px;border-radius:var(--rs);font-weight:600;font-size:.88rem;transition:all .3s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:var(--gradient);color:#fff}.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,152,102,.3)}
.btn-s{background:transparent;color:var(--g2);border:2px solid var(--g2)}.btn-s:hover{background:var(--g2);color:#fff}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.bg-green{background:rgba(0,152,102,.1);color:var(--g2)}.bg-orange{background:rgba(240,171,0,.1);color:#c78800}
.bg-blue{background:rgba(0,87,191,.1);color:var(--research)}.bg-coral{background:rgba(224,104,75,.1);color:var(--clinical)}
.bg-purple{background:rgba(129,49,176,.1);color:var(--mfg)}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
#login{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0fdf4,#ecfdf5 30%,#f0f9ff 70%,#f4f7fa);position:relative;overflow:hidden}
.login-orb{position:absolute;border-radius:50%;pointer-events:none}
.login-card{width:420px;padding:48px;border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.5);box-shadow:0 24px 80px rgba(0,82,70,.1);text-align:center;position:relative;z-index:1;animation:fadeUp .6s ease}
.login-card h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#005246,#009866);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:4px 0}
.login-card input{width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid var(--border);font-size:.9rem;margin-bottom:12px;background:rgba(244,247,250,.6);transition:border .3s}
.login-card input:focus{border-color:var(--g2)}
.login-btn{width:100%;padding:13px;border-radius:12px;background:var(--gradient);color:#fff;font-weight:700;font-size:.95rem;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,152,102,.3);transition:transform .2s}
.login-btn:hover{transform:translateY(-2px)}

#sidebar{width:260px;height:100vh;background:linear-gradient(180deg,#003d33,#005246 40%,#00695c);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s;overflow:hidden}
#sidebar.collapsed{width:72px}
#sidebar .logo{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
#sidebar.collapsed .logo{justify-content:center;padding:20px 0}
#sidebar .logo span{color:#fff;font-weight:800;font-size:1.2rem;letter-spacing:-.5px;white-space:nowrap}
#sidebar.collapsed .logo span,#sidebar.collapsed .nav-label,#sidebar.collapsed .user-info{display:none}
#sidebar nav{flex:1;padding:12px 0;overflow-y:auto}
#sidebar nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 20px;color:rgba(255,255,255,.6);font-size:.85rem;transition:all .2s;border-left:3px solid transparent;white-space:nowrap}
#sidebar.collapsed nav button{justify-content:center;padding:10px 0}
#sidebar nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
#sidebar nav button.active{color:#7ec681;background:rgba(126,198,129,.15);border-left-color:#7ec681;font-weight:600}
#sidebar .user-bar{padding:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.8rem;flex-shrink:0}

#header{height:56px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:6px 14px;width:320px}
.search-bar input{border:none;background:transparent;font-size:.85rem;flex:1;color:var(--txt)}
.notif-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid #fff}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#content{flex:1;overflow-y:auto;overflow-x:hidden}

/* Toast */
.toast-container{position:fixed;top:80px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:10px;font-size:.85rem;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.1);animation:fadeUp .4s ease;max-width:360px;border-left:4px solid #10b981;background:#ecfdf5;color:#065f46}

/* Page sections */
.page{padding:28px;animation:fadeIn .3s ease}
.welcome-banner{padding:28px 32px;border-radius:20px;background:linear-gradient(135deg,#005246,#009866,#34d399);color:#fff;margin-bottom:28px;position:relative;overflow:hidden}
.welcome-banner::after{content:'';position:absolute;top:0;right:0;width:300px;height:100%;background:radial-gradient(circle at 80% 50%,rgba(255,255,255,.1),transparent);pointer-events:none}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{padding:24px;position:relative;overflow:hidden}
.stat-card .icon{position:absolute;top:-10px;right:-10px;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.stat-card .label{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-card .value{font-size:2rem;font-weight:800;line-height:1}

.two-col{display:grid;grid-template-columns:1fr 380px;gap:20px}
.study-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;cursor:pointer;transition:background .2s}
.study-row:hover{background:var(--bg)}
.species-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.progress-bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--gradient);transition:width 1.2s ease}
.activity-row{display:flex;gap:12px;padding:10px 12px;border-radius:8px;transition:background .2s;cursor:pointer}
.activity-row:hover{background:var(--bg)}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:24px}
.tabs button{flex:1;padding:10px 16px;border-radius:10px;font-weight:500;font-size:.82rem;transition:all .2s;text-transform:capitalize}
.tabs button.active{background:#fff;font-weight:700;color:var(--g3);box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* Protocol wizard */
.step-bar{display:flex;gap:0;margin-bottom:32px}
.step-item{display:flex;align-items:center;flex:1}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;transition:all .3s;flex-shrink:0}
.step-line{flex:1;height:2px;margin:0 12px;border-radius:1px;transition:background .5s}
.drop-zone{max-width:500px;margin:0 auto;padding:48px 32px;border-radius:16px;border:2px dashed var(--g2);background:rgba(0,152,102,.03);cursor:pointer;text-align:center;transition:all .3s}
.drop-zone:hover{border-color:var(--g3);background:rgba(0,152,102,.06)}

/* Protocol inline editor */
.proto-editor{font-family:'Inter',system-ui,sans-serif;font-size:.85rem;line-height:1.7;color:var(--txt)}
.proto-editor h1{font-size:1.15rem;font-weight:800;margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--g2);position:relative}
.section-actions{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);gap:4px;align-items:center}
.proto-editor h1:hover .section-actions{display:flex}
.section-actions button{font-size:.62rem;padding:3px 8px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .15s}
.section-actions button:hover{border-color:var(--g2);color:var(--g3);background:rgba(0,152,102,.05)}
.proto-editor h2{font-size:1rem;font-weight:700;margin:18px 0 6px;color:var(--g3)}
.proto-editor h3{font-size:.9rem;font-weight:700;margin:14px 0 4px}
.proto-editor p{margin:6px 0}
.proto-editor table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.8rem}
.proto-editor th,.proto-editor td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
.proto-editor th{background:var(--bg);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.3px}
.proto-field{background:rgba(0,152,102,.08);border:1px solid rgba(0,152,102,.25);border-radius:4px;padding:1px 6px;cursor:pointer;position:relative;transition:all .2s;display:inline}
.proto-field:hover{background:rgba(0,152,102,.15);border-color:var(--g2)}
.proto-field-q{background:rgba(0,87,191,.08);border:1px solid rgba(0,87,191,.25);border-radius:4px;padding:1px 6px;cursor:pointer;position:relative;transition:all .2s;display:inline}
.proto-field-q:hover{background:rgba(0,87,191,.15);border-color:var(--research)}
.proto-field-tpl{background:rgba(240,171,0,.08);border:1px solid rgba(240,171,0,.25);border-radius:4px;padding:1px 6px;cursor:pointer;position:relative;transition:all .2s;display:inline}
.proto-field-tpl:hover{background:rgba(240,171,0,.15);border-color:var(--preclinical)}
.proto-field-need{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:4px;padding:1px 6px;cursor:pointer;position:relative;transition:all .2s;display:inline;color:#dc2626}
.proto-field-need:hover{background:rgba(239,68,68,.15)}
.proto-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:var(--bg);border-radius:10px;font-size:.78rem}
.proto-legend-item{display:flex;align-items:center;gap:6px}
.proto-legend-dot{width:14px;height:14px;border-radius:3px;flex-shrink:0}
.proto-section-nav{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);z-index:10;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.proto-section-nav button{padding:4px 12px;border-radius:6px;font-size:.72rem;font-weight:500;margin:2px;transition:all .2s}
.proto-section-nav button:hover{background:rgba(0,152,102,.08)}
.proto-section-nav button.active{background:var(--g2);color:#fff;font-weight:600}
.proto-toc{margin:12px 0 20px;padding:16px 20px;background:var(--bg);border-radius:10px}
.proto-toc a{display:block;padding:3px 0;font-size:.82rem;color:var(--g3);text-decoration:none;transition:color .2s}
.proto-toc a:hover{color:var(--g2)}
.proto-editable{outline:none;border-radius:4px;transition:box-shadow .2s;min-width:20px;display:inline}
.proto-editable:focus{box-shadow:0 0 0 2px var(--g2);background:rgba(0,152,102,.03)}
.proto-editable:hover{background:rgba(0,0,0,.02)}

/* Q&A Wizard Side Panel */
.wizard-panel{position:fixed;top:0;right:-480px;width:460px;height:100vh;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:1001;transition:right .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
.wizard-panel.open{right:0}
.wizard-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none}
.wizard-backdrop.open{opacity:1;pointer-events:auto}
.wizard-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.wizard-body{flex:1;overflow-y:auto;padding:20px 24px}
.wizard-footer{padding:16px 24px;border-top:1px solid var(--border);flex-shrink:0;background:#fff;display:flex;gap:10px;align-items:center}
.wizard-q-card{padding:14px 16px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:#fff;transition:all .2s}
.wizard-q-card.answered{border-color:rgba(0,152,102,.3);background:rgba(0,152,102,.02)}
.wizard-q-card input,.wizard-q-card select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.84rem;font-family:inherit;transition:border-color .2s;box-sizing:border-box}
.wizard-q-card input:focus,.wizard-q-card select:focus{outline:none;border-color:var(--g2);box-shadow:0 0 0 3px rgba(0,152,102,.1)}
.wizard-progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.wizard-progress-bar{height:100%;background:var(--g2);border-radius:2px;transition:width .4s ease}

/* Template Builder */
.tb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tb-card{padding:20px;border-radius:var(--rs);border:2px solid var(--border);cursor:pointer;transition:all .25s;text-align:center;position:relative}
.tb-card:hover{border-color:var(--g2);transform:translateY(-2px);box-shadow:var(--shadow)}
.tb-card.selected{border-color:var(--g2);background:rgba(0,152,102,.04);box-shadow:0 0 0 3px rgba(0,152,102,.15)}
.tb-card .tb-ico{font-size:2rem;margin-bottom:8px}
.tb-card .tb-label{font-weight:700;font-size:.9rem;margin-bottom:2px}
.tb-card .tb-meta{font-size:.72rem;color:var(--muted)}
.tb-card .tb-check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--g2);color:#fff;display:none;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.tb-card.selected .tb-check{display:flex}
.tb-steps{display:flex;gap:0;margin-bottom:28px;position:relative}
.tb-steps::after{content:'';position:absolute;top:18px;left:40px;right:40px;height:2px;background:var(--border);z-index:0}
.tb-step{flex:1;text-align:center;position:relative;z-index:1}
.tb-step .tb-step-num{width:36px;height:36px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;margin-bottom:6px;transition:all .3s}
.tb-step.active .tb-step-num{background:var(--g2);color:#fff;border-color:var(--g2)}
.tb-step.done .tb-step-num{background:var(--g1);color:#fff;border-color:var(--g1)}
.tb-step .tb-step-label{display:block;font-size:.72rem;font-weight:600;color:var(--muted)}
.tb-step.active .tb-step-label{color:var(--g2)}
.tb-step.done .tb-step-label{color:var(--g1)}
.tb-section-list{max-height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--rs);padding:8px}
.tb-section-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;transition:background .2s;cursor:pointer}
.tb-section-row:hover{background:var(--bg)}
.tb-section-row .tb-sec-num{width:32px;height:32px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--g3);flex-shrink:0}
.tb-section-row .tb-sec-label{flex:1;font-size:.85rem;font-weight:500}
.tb-section-row .tb-sec-status{font-size:.68rem;padding:3px 10px;border-radius:20px;font-weight:600}
.tb-notif-panel{border:1px solid var(--border);border-radius:var(--rs);padding:16px;background:var(--bg);margin-top:16px}
.tb-notif-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border-radius:8px;margin-bottom:6px;font-size:.82rem}
.tb-timeline{position:relative;padding-left:24px;margin:16px 0}
.tb-timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.tb-timeline-item{position:relative;padding:8px 0 16px;font-size:.82rem}
.tb-timeline-item::before{content:'';position:absolute;left:-20px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--g2);border:2px solid #fff;box-shadow:0 0 0 2px var(--g2)}
.tb-scope-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tb-scope-tag{padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:600;border:1.5px solid var(--border);cursor:pointer;transition:all .2s}
.tb-scope-tag:hover{border-color:var(--g2)}
.tb-scope-tag.active{background:var(--g2);color:#fff;border-color:var(--g2)}

/* Feature cards */
.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.feature-grid.tri{grid-template-columns:repeat(3,1fr)}
.feature-card{padding:20px;cursor:pointer}
.feature-card .icon-box{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;margin-bottom:10px}

/* Chat */
.chat-layout{display:flex;height:calc(100vh - 56px)}
.chat-sidebar{width:260px;border-right:1px solid var(--border);background:#fff;display:flex;flex-direction:column}
.chat-main{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.chat-messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:70%;padding:14px 18px;font-size:.85rem;line-height:1.6;animation:fadeUp .3s ease both;white-space:pre-wrap}
.msg-user{align-self:flex-end;background:var(--g3);color:#fff;border-radius:18px 18px 4px 18px}
.msg-ada{align-self:flex-start;background:#fff;color:var(--txt);border-radius:18px 18px 18px 4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chat-input-bar{padding:16px;background:#fff;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
.chat-input-bar input{flex:1;padding:12px 16px;border-radius:12px;border:1.5px solid var(--border);font-size:.85rem;transition:border .3s}
.chat-input-bar input:focus{border-color:var(--g2)}

/* Roadmap */
.timeline{position:relative;display:flex;margin-bottom:40px;padding-top:20px}
.timeline::before{content:'';position:absolute;top:38px;left:0;right:0;height:4px;background:var(--border);border-radius:2px}
.phase{flex:1;text-align:center;position:relative;z-index:1}
.phase-dot{width:40px;height:40px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.8rem;cursor:pointer;transition:transform .3s}
.phase-dot:hover{transform:scale(1.15)}

/* Data flow */
.flow-row{display:flex;align-items:center;gap:0;overflow-x:auto;padding:8px 0}
.flow-node{min-width:150px;padding:14px;border-radius:10px;text-align:center;cursor:pointer;transition:transform .2s}
.flow-node:hover{transform:scale(1.04)}
.flow-arrow{width:24px;height:2px;background:var(--border);flex-shrink:0}

/* Scenario sliders */
.slider-group{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:20px;align-items:end}
.slider-group label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
.slider-group input[type=range]{width:100%;accent-color:var(--g2)}

/* Search page */
.search-container{display:grid;grid-template-columns:260px 1fr;gap:20px}
.facet-panel{position:sticky;top:0}
.facet-group{margin-bottom:16px}
.facet-group h4{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.facet-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.82rem;transition:background .2s}
.facet-item:hover{background:rgba(0,152,102,.05)}

/* ===== HELPERS ===== */
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='className')el.className=v;
    else if(k==='onclick'||k==='oninput'||k==='onkeydown'||k==='onfocus'||k==='onblur')el[k]=v;
    else if(k==='innerHTML')el.innerHTML=v;
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{if(c!=null){el.appendChild(typeof c==='string'?document.createTextNode(c):c)}});
  return el;
}

function toast(msg){
  const t=h('div',{className:'toast'},msg);
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

function speciesBg(sp){return sp==='Swine'?'rgba(240,171,0,.1)':sp==='Rat'?'rgba(0,87,191,.1)':'rgba(224,104,75,.1)'}
function statusBadge(s){return s==='active'?'bg-green':s==='completed'?'bg-blue':'bg-orange'}

function animateCount(el,target,dur=1500){
  let start=null;
  const step=(ts)=>{if(!start)start=ts;const p=Math.min((ts-start)/dur,1);el.textContent=Math.floor(p*target).toLocaleString()+(el.dataset.suffix||'');if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

async function doLogin(e){
  e.preventDefault();
  const errEl = document.getElementById('login-error');

    jwtToken = data.token;
    currentUser = {username:data.username, email:data.email, role:data.role, full_name:data.full_name};

function apiCall(url, options={}) {
  apiLoading = true;
  // Inject JWT Authorization header (skip for login and health)
  if(jwtToken && !url.includes('/auth/login') && !url.includes('/health')){
    if(!options.headers) options.headers={};
    // Don't overwrite Content-Type for FormData (multipart)
    if(!(options.body instanceof FormData)){
      options.headers['Content-Type'] = options.headers['Content-Type'] || 'application/json';
    }
    options.headers['Authorization'] = 'Bearer '+jwtToken;
  }
  return fetch(API_BASE + url, options)
    .then(r => {
      if(r.status===401){doLogout();throw new Error('Session expired. Please log in again.');}
      if (!r.ok) return r.json().then(err => { throw new Error(err.detail || 'API error'); });
      return r.json();
    })
    .finally(() => { apiLoading = false; });
}

let pendingDiffData = null;

function downloadProtocolDocx(pid){
  const protId=pid||currentProtocolId;
  if(!backendConnected||!protId){toast('No protocol available');return;}
  toast('Generating DOCX...');
  // Try /download first (pre-generated), fall back to /download-docx (on-the-fly generation)
  const headers={'Authorization':'Bearer '+jwtToken};
  fetch(API_BASE+'/api/protocols/'+protId+'/download',{headers})
    .then(r=>{
      if(!r.ok) return fetch(API_BASE+'/api/protocols/'+protId+'/download-docx',{headers});
      return r;
    })
    .then(r=>{
      if(!r.ok) throw new Error('Download failed ('+r.status+')');
      // Extract filename from Content-Disposition if available
      const cd=r.headers.get('Content-Disposition')||'';
      const fnMatch=cd.match(/filename="?([^";\n]+)"?/);
      const fname=fnMatch?fnMatch[1]:'protocol_'+protId+'.docx';
      return r.blob().then(blob=>({blob,fname}));
    })
    .then(({blob,fname})=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=fname;
      document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
      toast('Protocol downloaded as DOCX');
    }).catch(e=>toast('Download failed: '+e.message));
}

async function uploadEditedDocx(file){
  if(!file){return;}
  if(!backendConnected||!currentProtocolId){toast('No protocol available');return;}
  if(!file.name.toLowerCase().endsWith('.docx')){toast('Only .docx files accepted');return;}
  const statusEl=document.getElementById('upload-status');
  statusEl.textContent='Parsing changes...';
  const formData=new FormData();
  formData.append('file',file);
  try{
    const data=await apiCall('/api/protocols/'+currentProtocolId+'/upload-changes',{method:'POST',body:formData});
    pendingDiffData=data;
    statusEl.textContent='';
    const banner=document.getElementById('pending-changes-banner');
    const summary=document.getElementById('pending-summary');
    if(banner&&summary){
      const s=data.diff.summary;
      summary.textContent=s.modified_count+' modified, '+s.added_count+' added, '+s.deleted_count+' deleted (confidence: '+(data.confidence*100).toFixed(0)+'%)';
      banner.style.display='block';
    }
    toast(data.diff.summary.total_changes+' change(s) detected \u2014 review before applying');
  }catch(e){
    statusEl.textContent='';
    toast('Upload failed: '+e.message);
  }
}

            <input type="checkbox" ${checked} onchange="window._crToggle('${ch.field}',this.checked)" style="accent-color:var(--g2)">
            <span style="font-weight:700;font-size:.8rem">${ch.field}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.78rem">
            <div style="background:#fff;padding:8px 10px;border-radius:6px;border:1px solid var(--border)">
              <div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;margin-bottom:2px">Original</div>
              <div style="word-break:break-word">${_esc(ch.original)}</div>
            </div>
            <div style="background:#fff;padding:8px 10px;border-radius:6px;border:1px solid var(--border)">
              <div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;margin-bottom:2px">Updated</div>
              <div style="word-break:break-word">${_esc(ch.updated)}</div>
            </div>
          </div>
        `;
        listDiv.appendChild(row);
      });
    } else {
      // Redline view
      modified.forEach(ch=>{
        const checked=selectedFields.has(ch.field)?'checked':'';
        const row=document.createElement('div');
        row.style.cssText='background:var(--bg);padding:12px;border-radius:10px;margin-bottom:8px;border-left:3px solid var(--research);';
        let redlineHtml='';
        if(ch.inline_diff&&ch.inline_diff.segments){
          ch.inline_diff.segments.forEach(seg=>{
            if(seg.type==='equal') redlineHtml+=_esc(seg.text);
            else if(seg.type==='delete') redlineHtml+='<span style="background:#fecaca;text-decoration:line-through;color:#dc2626">'+_esc(seg.text)+'</span>';
            else if(seg.type==='insert') redlineHtml+='<span style="background:#bbf7d0;text-decoration:underline;color:#16a34a">'+_esc(seg.text)+'</span>';
          });
        } else {
          redlineHtml='<span style="background:#fecaca;text-decoration:line-through;color:#dc2626">'+_esc(ch.original)+'</span> <span style="background:#bbf7d0;text-decoration:underline;color:#16a34a">'+_esc(ch.updated)+'</span>';
        }
        row.innerHTML=`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <input type="checkbox" ${checked} onchange="window._crToggle('${ch.field}',this.checked)" style="accent-color:var(--g2)">
            <span style="font-weight:700;font-size:.8rem">${ch.field}</span>
          </div>
          <div style="font-size:.82rem;line-height:1.6;padding:8px 10px;background:#fff;border-radius:6px;border:1px solid var(--border);word-break:break-word">${redlineHtml}</div>
        `;
        listDiv.appendChild(row);
      });
    }

    // Show added fields
    added.forEach(ch=>{
      const row=document.createElement('div');
      row.style.cssText='background:rgba(16,185,129,.05);padding:12px;border-radius:10px;margin-bottom:8px;border-left:3px solid #10b981;';
      row.innerHTML=`<div style="font-weight:700;font-size:.8rem;margin-bottom:4px"><span style="color:#10b981">+ Added:</span> ${ch.field}</div><div style="font-size:.78rem">${_esc(ch.value)}</div>`;
      listDiv.appendChild(row);
    });

    panel.appendChild(listDiv);

    // Action buttons
    const actions=document.createElement('div');
    actions.style.cssText='display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:16px;';
    actions.innerHTML=`
      <button class="btn btn-s" style="font-size:.78rem;padding:8px 16px" onclick="document.getElementById('change-review-modal').remove()">Cancel</button>
      <button class="btn btn-s" style="font-size:.78rem;padding:8px 16px" onclick="window._crAcceptSelected()">Accept Selected (${selectedFields.size})</button>
      <button class="btn btn-p" style="font-size:.78rem;padding:8px 16px" onclick="window._crAcceptAll()">Accept All Changes</button>
    `;
    panel.appendChild(actions);

    overlay.innerHTML='';
    overlay.appendChild(panel);
  }

  function _esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  window._crSetView=function(mode){viewMode=mode;render();};
  window._crToggle=function(field,checked){if(checked)selectedFields.add(field);else selectedFields.delete(field);render();};
  window._crAcceptAll=async function(){
    try{
      await apiCall('/api/protocols/'+currentProtocolId+'/accept-all-changes',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      overlay.remove();pendingDiffData=null;
      document.getElementById('pending-changes-banner').style.display='none';
      toast('All changes accepted \u2014 new version created');
      loadVersionsAndAmendments();
    }catch(e){toast('Failed: '+e.message);}
  };
  window._crAcceptSelected=async function(){
    const fields=Array.from(selectedFields);
    if(!fields.length){toast('No changes selected');return;}
    try{
      await apiCall('/api/protocols/'+currentProtocolId+'/accept-changes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
      overlay.remove();pendingDiffData=null;
      document.getElementById('pending-changes-banner').style.display='none';
      toast(fields.length+' change(s) accepted \u2014 new version created');
      loadVersionsAndAmendments();
    }catch(e){toast('Failed: '+e.message);}
  };

  render();
  document.body.appendChild(overlay);
}

function confirmSpeciesAndExtract(){
  if(!backendConnected){toast('Backend not connected. Please ensure the Ada server is running.');return;}
  if(!currentProtocolId){toast('No protocol loaded. Please upload documents first.');return;}

  const species=detectedSpecies;
  if(!species||species==='common'){toast('Please select a species before continuing.');return;}

  const panel=document.getElementById('protocol-panel');
  if(panel) panel.innerHTML='<div style="text-align:center"><div style="width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--g2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px"></div><p style="font-weight:600;color:var(--g3);font-size:1rem">Extracting protocol data via AI...</p><p style="font-size:.82rem;color:var(--muted);margin-top:6px">Sending document text to Azure OpenAI for structured extraction. This may take 15-30 seconds.</p></div>';

  apiCall('/api/protocols/'+currentProtocolId+'/extract',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({animal_type:species})
  }).then(data=>{
    currentProtocolData=data.extracted_json;
    window._lastGapAnalysis=data.gap_analysis||null;
    gapAnalysisData=null; /* Reset so Step 3 reloads fresh */

}

let gapAnalysisData=null;
let wizardQuestions=[];
let wizardAnswers={};
let sectionStatuses=null;
let activeLocks={};

async function loadGapAnalysis(){
  if(!backendConnected||!currentProtocolId) return;
  try{
    const data=await apiCall('/api/protocols/'+currentProtocolId+'/gaps');
    gapAnalysisData=data;
    return data;
  }catch(e){console.error('Gap analysis failed:',e);}
}

async function loadWizardQuestions(){
  if(!backendConnected||!currentProtocolId) return;
  try{
    const data=await apiCall('/api/protocols/'+currentProtocolId+'/questions?sort=criticality');
    wizardQuestions=data.questions||[];
    return data;
  }catch(e){console.error('Load questions failed:',e);}
}

async function submitWizardAnswers(){
  const answeredKeys=Object.keys(wizardAnswers).filter(k=>wizardAnswers[k]!=='');
  if(!backendConnected||!currentProtocolId||answeredKeys.length===0) return;
  const payload={};
  answeredKeys.forEach(k=>{payload[k]=wizardAnswers[k];});
  const data=await apiCall('/api/protocols/'+currentProtocolId+'/answers',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  toast(data.fields_updated+' gaps resolved! Completeness: '+Math.round(data.completeness_score*100)+'%');
  wizardAnswers={};
  gapAnalysisData=null;
  protocolStep=3;navigate('protocol');
}

        <div style="font-size:.68rem;color:var(--muted);font-weight:600">Fields Extracted</div>
      </div>
      <div style="padding:14px;border-radius:10px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.15);text-align:center">
        <div style="font-size:1.6rem;font-weight:800;color:#ef4444">${s.missing_critical||0}</div>
        <div style="font-size:.68rem;color:var(--muted);font-weight:600">Critical Gaps</div>
      </div>
      <div style="padding:14px;border-radius:10px;background:rgba(240,171,0,.05);border:1px solid rgba(240,171,0,.15);text-align:center">
        <div style="font-size:1.6rem;font-weight:800;color:#f0ab00">${s.low_confidence||0}</div>

    ${critical.length?`<div style="margin-bottom:16px"><div style="font-weight:700;font-size:.85rem;color:#ef4444;margin-bottom:8px">\u274C Critical Gaps (${critical.length})</div>
      <div style="max-height:180px;overflow-y:auto;border:1px solid rgba(239,68,68,.2);border-radius:8px">${critical.map(f=>`<div style="padding:8px 12px;border-bottom:1px solid rgba(239,68,68,.1);display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:.78rem;font-weight:600">${f.path}</div><div style="font-size:.68rem;color:var(--muted)">${f.description||''}</div></div>
        ${f.suggestion?`<span style="font-size:.65rem;background:rgba(0,152,102,.08);padding:3px 8px;border-radius:4px;color:var(--g3)">Suggested: ${f.suggestion}</span>`:''}

    ${regIssues.length?`<div style="margin-bottom:16px"><div style="font-weight:700;font-size:.85rem;color:var(--research);margin-bottom:8px">\uD83D\uDCCB Regulatory Gaps (${regIssues.length})</div>
      ${regIssues.map(r=>`<div style="padding:8px 12px;background:rgba(0,87,191,.04);border-radius:6px;margin-bottom:4px;font-size:.76rem;border-left:3px solid var(--research)"><strong>${r.requirement}:</strong> ${r.field} \u2014 <em>${r.status}</em></div>`).join('')}</div>`:''}

function showQAWizard(){
  if(!wizardQuestions.length){
    loadWizardQuestions().then(()=>{renderWizardPanel();});
    return;
  }
  renderWizardPanel();
}

function closeWizardPanel(){
  const panel=document.getElementById('wizard-panel');
  const backdrop=document.getElementById('wizard-backdrop');
  if(panel) panel.classList.remove('open');
  if(backdrop) backdrop.classList.remove('open');
  setTimeout(()=>{if(panel)panel.remove();if(backdrop)backdrop.remove();},350);
}

function renderWizardPanel(){
  /* Remove any existing wizard */
  const old=document.getElementById('wizard-panel');
  if(old){old.remove();document.getElementById('wizard-backdrop')?.remove();}

  const critical=wizardQuestions.filter(q=>q.criticality==='critical');
  const recommended=wizardQuestions.filter(q=>q.criticality==='recommended');
  const optional=wizardQuestions.filter(q=>q.criticality==='optional');
  const total=wizardQuestions.length;
  const answered=Object.keys(wizardAnswers).length;
  const pct=total?Math.round(answered/total*100):0;

  /* Backdrop */
  const backdrop=document.createElement('div');
  backdrop.id='wizard-backdrop';
  backdrop.className='wizard-backdrop';
  backdrop.onclick=closeWizardPanel;
  document.body.appendChild(backdrop);

  /* Panel */
  const panel=document.createElement('div');
  panel.id='wizard-panel';
  panel.className='wizard-panel';
  panel.innerHTML=`
    <div class="wizard-header">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div><h3 style="font-size:1.05rem;font-weight:700;margin:0">Q&A Wizard</h3><p style="font-size:.75rem;color:var(--muted);margin:2px 0 0">Resolve protocol gaps</p></div>
        <button onclick="closeWizardPanel()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .15s" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='none'">\u2715</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:.78rem;font-weight:600" id="wizard-answered-label">${answered} of ${total} answered</span>
        <span style="font-size:.72rem;font-weight:700;color:var(--g2)" id="wizard-pct-label">${pct}%</span>
      </div>
      <div class="wizard-progress"><div class="wizard-progress-bar" id="wizard-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="wizard-body" id="wizard-body">
      ${critical.length?`<div style="margin-bottom:16px"><div style="font-weight:700;font-size:.8rem;color:#ef4444;margin-bottom:8px;display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block"></span>Critical (${critical.length})</div>${critical.map(q=>renderQuestionCard(q)).join('')}</div>`:''}
      ${recommended.length?`<div style="margin-bottom:16px"><div style="font-weight:700;font-size:.8rem;color:#f0ab00;margin-bottom:8px;display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#f0ab00;display:inline-block"></span>Recommended (${recommended.length})</div>${recommended.map(q=>renderQuestionCard(q)).join('')}</div>`:''}
      ${optional.length?`<div style="margin-bottom:16px"><div style="font-weight:700;font-size:.8rem;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block"></span>Optional (${optional.length})</div>${optional.map(q=>renderQuestionCard(q)).join('')}</div>`:''}
      ${!total?'<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:2rem;margin-bottom:8px">\u2705</div><p style="font-weight:600">No gaps to resolve!</p><p style="font-size:.78rem;margin-top:4px">All protocol fields are complete.</p></div>':''}
    </div>
    <div class="wizard-footer">
      <button class="btn btn-s" style="font-size:.78rem;padding:8px 16px" onclick="closeWizardPanel()">Close</button>
      <span style="flex:1"></span>
      <button class="btn btn-p" style="font-size:.78rem;padding:8px 20px" id="wizard-save-btn" onclick="handleWizardSave()" ${!answered?'disabled style="opacity:.5;cursor:not-allowed;font-size:.78rem;padding:8px 20px"':''}>Save ${answered} Answer${answered!==1?'s':''}</button>
    </div>`;
  document.body.appendChild(panel);

  /* Animate open */
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    panel.classList.add('open');
    backdrop.classList.add('open');
  });});
}

function renderQuestionCard(q){
  const val=wizardAnswers[q.field_path]||'';
  const hasAnswer=val!=='';
  const uid='wq_'+q.field_path.replace(/[^a-zA-Z0-9]/g,'_');
  let inputHtml='';
  if(q.input_type==='select'&&q.options&&q.options.length){
    inputHtml=`<select id="${uid}" onchange="wizardAnswers['${q.field_path}']=this.value;updateWizardCount()" class="wizard-q-input">
      <option value="">Select...</option>${q.options.map(o=>`<option value="${o}"${val===o?' selected':''}>${o}</option>`).join('')}</select>`;
  }else if(q.input_type==='number'){
    inputHtml=`<input id="${uid}" type="number" value="${val}" oninput="wizardAnswers['${q.field_path}']=this.value;updateWizardCount()" placeholder="Enter value...">`;
  }else{
    inputHtml=`<input id="${uid}" type="text" value="${val}" oninput="wizardAnswers['${q.field_path}']=this.value;updateWizardCount()" placeholder="${q.suggestion||'Enter value...'}">`;
  }
  return `<div class="wizard-q-card${hasAnswer?' answered':''}" id="card_${uid}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <div style="font-size:.8rem;font-weight:600;flex:1">${q.question_text}</div>
      ${hasAnswer?'<span style="font-size:.6rem;background:var(--g2);color:#fff;padding:2px 7px;border-radius:6px;margin-left:8px;white-space:nowrap">\u2713 Done</span>':''}
    </div>
    <div style="font-size:.7rem;color:var(--muted);margin-bottom:8px;line-height:1.4">${q.why_it_matters||''}</div>
    <div style="font-size:.66rem;color:var(--g3);margin-bottom:6px;font-family:monospace">${q.field_path}</div>
    ${inputHtml}
    ${q.suggestion?`<button onclick="wizardAnswers['${q.field_path}']='${q.suggestion.replace(/'/g,"\\'")}';document.getElementById('${uid}').value='${q.suggestion.replace(/'/g,"\\'")}';updateWizardCount();document.getElementById('card_${uid}').classList.add('answered')" style="margin-top:6px;background:none;border:none;font-size:.7rem;color:var(--g3);cursor:pointer;padding:0;display:flex;align-items:center;gap:4px">\u2728 Use suggestion: <strong>${q.suggestion}</strong></button>`:''}
  </div>`;
}

function updateWizardCount(){
  const answered=Object.keys(wizardAnswers).filter(k=>wizardAnswers[k]!=='').length;
  const total=wizardQuestions.length;
  const pct=total?Math.round(answered/total*100):0;
  const label=document.getElementById('wizard-answered-label');
  const pctLabel=document.getElementById('wizard-pct-label');
  const fill=document.getElementById('wizard-progress-fill');
  const btn=document.getElementById('wizard-save-btn');
  if(label)label.textContent=answered+' of '+total+' answered';
  if(pctLabel)pctLabel.textContent=pct+'%';
  if(fill)fill.style.width=pct+'%';
  if(btn){
    btn.textContent='Save '+answered+' Answer'+(answered!==1?'s':'');
    btn.disabled=!answered;
    btn.style.opacity=answered?'1':'.5';
    btn.style.cursor=answered?'pointer':'not-allowed';
  }
  /* Update individual card states */
  wizardQuestions.forEach(q=>{
    const uid='wq_'+q.field_path.replace(/[^a-zA-Z0-9]/g,'_');
    const card=document.getElementById('card_'+uid);
    if(card){
      const hasVal=wizardAnswers[q.field_path]&&wizardAnswers[q.field_path]!=='';
      card.classList.toggle('answered',hasVal);
    }
  });
}

async function handleWizardSave(){
  const btn=document.getElementById('wizard-save-btn');
  if(btn){btn.textContent='Saving...';btn.disabled=true;btn.style.opacity='.6';}
  try{
    await submitWizardAnswers();
    closeWizardPanel();
  }catch(e){
    if(btn){btn.textContent='Retry Save';btn.disabled=false;btn.style.opacity='1';}
    toast('Save failed: '+e.message);
  }
}

async function loadSectionStatuses(){
  if(!backendConnected||!currentProtocolId) return;
  try{
    const data=await apiCall('/api/protocols/'+currentProtocolId+'/sections');

    activeLocks[sectionId]=data;
    return data;
  }catch(e){toast('Cannot lock: '+e.message);return null;}
}

async function releaseSectionLock(sectionId){
  if(!backendConnected||!currentProtocolId) return;

    await apiCall('/api/protocols/'+currentProtocolId+'/sections/'+sectionId+'/lock',{method:'DELETE'});
    delete activeLocks[sectionId];
    toast('Lock released on '+sectionId);
  }catch(e){toast('Failed to release: '+e.message);}
}

/* Highlighted field helpers */
function sow(text){return '<span class="proto-field" contenteditable="true" title="Source: SOW" data-source="sow">'+text+'</span>';}
function quest(text){return '<span class="proto-field-q" contenteditable="true" title="Source: Sponsor Questionnaire" data-source="quest">'+text+'</span>';}
function tpl(text){return '<span class="proto-field-tpl" title="From Protocol Template" data-source="tpl">'+text+'</span>';}
function need(text){return '<span class="proto-field-need" contenteditable="true" title="Needs Input" data-source="need">&lt;&lt;'+text+'&gt;&gt;</span>';}
function ed(text){return '<span class="proto-editable" contenteditable="true">'+text+'</span>';}
/* Data-aware field helper: renders from currentProtocolData or falls back to need() */
function d(path,label){
  const val=getNestedVal(currentProtocolData,path);
  if(val && val!=='' && !String(val).startsWith('<<')){
    /* Determine source from field path heuristics */
    if(path.includes('TestArticle')||path.includes('Sponsor')||path.includes('StudyNo')||path.includes('Route')||path.includes('Species')||path.includes('Animals')||path.includes('Duration')) return sow(String(val));
    return quest(String(val));
  }
  return need(label||path.split('.').pop());
}
function getNestedVal(obj,path){
  if(!obj)return '';
  const parts=path.split('.');
  let cur=obj;
  for(const p of parts){
    if(cur===null||cur===undefined)return '';
    /* Handle array index like TestArticle.0.Identification */
    if(!isNaN(p)){cur=Array.isArray(cur)?cur[parseInt(p)]:cur;continue;}
    cur=cur[p]!==undefined?cur[p]:(cur[p.toLowerCase()]!==undefined?cur[p.toLowerCase()]:undefined);
    if(cur===undefined){
      /* Try case-insensitive match */
      if(typeof obj==='object'&&obj!==null){
        const keys=Object.keys(obj);
        const match=keys.find(k=>k.toLowerCase()===p.toLowerCase());
        if(match)cur=obj[match];
      }
      if(cur===undefined)return '';
    }
  }
  if(typeof cur==='object')return JSON.stringify(cur);
  return cur===null||cur===undefined?'':String(cur);
}

/* Build study info from currentProtocolData */
function getStudyNumber(){
  const d=currentProtocolData;
  if(!d)return currentProtocolId||'';
  return getNestedVal(d,'BasicDetails.StudyNo')||getNestedVal(d,'studyNo')||getNestedVal(d,'study_number')||currentProtocolId||'';
}
function getStudyTitle(){
  const d=currentProtocolData;
  if(!d)return '';
  /* Build from parts or return stored title */
  const obj=getNestedVal(d,'StudyInfo.Objective');
  const testPeriod=getNestedVal(d,'BasicDetails.TestPeriod');
  const species=getNestedVal(d,'TestSystem.SpeciesStrain')||detectedSpecies||'';
  const article=getNestedVal(d,'BasicDetails.TestArticleName')||getNestedVal(d,'TestMaterial.TestArticle.0.Identification')||'';
  const recovery=getNestedVal(d,'BasicDetails.RecoveryPeriod')||getNestedVal(d,'StudyInfo.RecoveryPeriod')||'';
  if(testPeriod && species && article){
    return 'A '+testPeriod+' Toxicity Study in '+species+' of '+article+(recovery?' with a '+recovery+' Recovery Period':'');
  }
  return obj||article||'Protocol '+getStudyNumber();
}
function getSponsor(){return getNestedVal(currentProtocolData,'BasicDetails.SponsorName')||'';}
function getTestArticle(){return getNestedVal(currentProtocolData,'BasicDetails.TestArticleName')||getNestedVal(currentProtocolData,'TestMaterial.TestArticle.0.Identification')||'';}
function getSpeciesName(){return getNestedVal(currentProtocolData,'TestSystem.SpeciesStrain')||detectedSpecies||'';}
function getRoute(){return getNestedVal(currentProtocolData,'StudyInfo.Route')||'';}
function getDuration(){return getNestedVal(currentProtocolData,'BasicDetails.TestPeriod')||getNestedVal(currentProtocolData,'StudyInfo.RouteDuration')||'';}

/* Template map for species */
function getTemplateName(){
  const sp=(detectedSpecies||'').toLowerCase();
  if(sp==='rat')return 'Rodent Template';
  if(sp==='dog')return 'Dog/Canine Template';
  if(sp==='swine')return 'Swine Template';
  return (sp||'Species')+ ' Template';
}

/* Count populated vs empty fields in currentProtocolData */
function countProtocolFields(obj,prefix){
  prefix=prefix||'';
  let filled=0,empty=0;
  if(!obj||typeof obj!=='object')return{filled:obj?1:0,empty:obj?0:1};
  const keys=Object.keys(obj);
  for(const k of keys){
    const v=obj[k];
    if(Array.isArray(v)){
      v.forEach((item,i)=>{
        const sub=countProtocolFields(item,prefix+k+'.'+i+'.');
        filled+=sub.filled;empty+=sub.empty;
      });
    }else if(v&&typeof v==='object'){
      const sub=countProtocolFields(v,prefix+k+'.');
      filled+=sub.filled;empty+=sub.empty;
    }else{
      if(v!==null&&v!==undefined&&v!==''&&!String(v).startsWith('<<'))filled++;else empty++;
    }
  }
  return{filled,empty};
}

  }
  page.appendChild(panel);c.appendChild(page);

      loadSectionStatuses().then(()=>{
        const container=document.getElementById('section-cards-container');

/* ===== EDIT PERSISTENCE ===== */
window._editorDirty=false;
window._editorSaving=false;

function collectEditorFields(){
  /* Collect all contenteditable spans from the protocol editor body */
  const body=document.getElementById('proto-editor-body');
  if(!body) return null;
  const fields={};
  body.querySelectorAll('span[contenteditable="true"]').forEach(span=>{
    const title=span.getAttribute('title')||'';
    const key=span.getAttribute('data-field-path');
    /* Try data attribute first, fall back to title-based key */
    if(key){
      fields[key]=span.textContent.trim();
    } else {
      /* Build key from table context: find parent row, use first cell text */
      const td=span.closest('td');
      const tr=td?td.closest('tr'):null;
      const th=tr?tr.querySelector('td:first-child, th:first-child'):null;
      const section=span.closest('[id^="ps"]');
      const sectionName=section?section.id:'unknown';
      const fieldLabel=th&&th!==td?th.textContent.trim():'';
      const compositeKey=sectionName+(fieldLabel?'.'+fieldLabel:'');
      if(compositeKey && compositeKey!=='unknown') fields[compositeKey]=span.textContent.trim();
    }
  });
  return fields;
}

function collectSectionFields(sectionIdx){
  /* Collect editable fields from a specific section wrapper */
  const wrapper=document.getElementById('secwrap-'+sectionIdx);
  if(!wrapper) return null;
  const fields={};
  wrapper.querySelectorAll('[contenteditable="true"]').forEach(el=>{
    const td=el.closest('td');
    const tr=td?td.closest('tr'):null;
    const th=tr?tr.querySelector('td:first-child, th:first-child'):null;
    const fieldLabel=th&&th!==el.closest('td')?th.textContent.trim():'';
    /* Also try to find key from nearest h2 */
    let sectionLabel='';
    let prev=el.closest('table')||el;
    while(prev.previousElementSibling){
      prev=prev.previousElementSibling;
      if(prev.tagName==='H2'||prev.tagName==='H3'){sectionLabel=prev.textContent.trim();break;}
    }
    const key=(sectionLabel?sectionLabel+'.':'')+(fieldLabel||el.textContent.trim().substring(0,30));
    if(key) fields[key]=el.textContent.trim();
  });
  return fields;
}

async function saveSectionEdits(sectionIdx){
  if(!backendConnected||!currentProtocolId){toast('Not connected to backend');return;}
  const fields=collectSectionFields(sectionIdx);
  if(!fields||Object.keys(fields).length===0){toast('No changes to save');toggleSectionEdit(sectionIdx);return;}

  /* Find matching section ID from sectionStatuses or build from index */
  const sectionIds=['TitlePage','StudyInformation','Personnel','RegulatoryCompliance','QualityAssurance',
    'TestMaterial','TestSystem','Husbandry','ExperimentalDesign','ExperimentalObservationsandProcedures',
    'ClinicalPathology','LaboratoryAssessments','TerminalProceduresandPathology','DataAnalyses',
    'ComputerizedSystemsandAnalyzers','AnimalCare','AmendedProtocolsandDeviations','Reporting',
    'SENDDatasets','ArchivalStorage','Appendix1','Appendix2','Approvals'];
  /* Adjust for editor indexing (ps1=StudyInformation which is idx 0 after cover) */
  const sectionId=sectionIds[sectionIdx+1]||('section_'+sectionIdx);

  try{
    const saveBtn=document.querySelector('#secwrap-'+sectionIdx+' .btn-p');
    if(saveBtn){saveBtn.textContent='Saving...';saveBtn.disabled=true;}
    await apiCall('/api/protocols/'+currentProtocolId+'/sections/'+sectionId,{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:fields})
    });
    toast('Section saved successfully');
    toggleSectionEdit(sectionIdx);
  }catch(e){
    /* Fallback: save as protocol-level update */
    try{
      const protocol=currentProtocolData||{};
      Object.assign(protocol,fields);
      await apiCall('/api/protocols/'+currentProtocolId+'/extract',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({manual_fields:fields})
      }).catch(()=>{});
      toast('Section saved (protocol-level)');
      toggleSectionEdit(sectionIdx);
    }catch(e2){
      toast('Save failed: '+e.message);
    }
  }
}

async function saveProtocolEdits(){
  if(!backendConnected||!currentProtocolId){toast('Not connected to backend');return;}
  if(window._editorSaving){return;}
  window._editorSaving=true;

  const saveBtn=document.querySelector('[onclick*="saveProtocolEdits"]');
  if(saveBtn){saveBtn.textContent='Saving...';saveBtn.disabled=true;}

  try{
    const fields=collectEditorFields();
    if(!fields||Object.keys(fields).length===0){toast('No editable fields found');return;}

    /* Save via version creation */
    const data=await apiCall('/api/protocols/'+currentProtocolId+'/versions',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        change_summary:'Interactive editor save \u2014 '+Object.keys(fields).length+' fields',
        changes:fields,
        change_type:'edit'
      })
    });
    const ver=data.version_number||data.version||'?';
    toast('Protocol saved as v'+ver+' \u2014 committed to audit trail');
    window._editorDirty=false;
  }catch(e){
    toast('Save failed: '+e.message);
  }finally{
    window._editorSaving=false;
    if(saveBtn){saveBtn.textContent='Save & Send for Review';saveBtn.disabled=false;}
  }
}

/* Make editor sections interactive after render */
function initEditorSections(){
  const body=document.getElementById('proto-editor-body');
  if(!body)return;
  const h1s=body.querySelectorAll('h1[id^="ps"]');
  h1s.forEach((h1,idx)=>{
    if(h1.dataset.wrapped)return;
    h1.dataset.wrapped='1';
    /* Collect all siblings until next h1 */
    const sectionContent=[];
    let sib=h1.nextElementSibling;
    while(sib && sib.tagName!=='H1'){
      sectionContent.push(sib);
      sib=sib.nextElementSibling;
    }
    /* Create wrapper */
    const wrapper=document.createElement('div');
    wrapper.className='editor-section-wrap';
    wrapper.id='secwrap-'+idx;
    const isActive=window.editorActiveSection===idx;
    const isEditing=window.editorSectionEditing[idx];
    wrapper.style.cssText='margin-bottom:4px;border:1px solid '+(isActive?'var(--g2)':'transparent')+';border-radius:10px;overflow:hidden;transition:all .2s;'+(isActive?'background:rgba(0,152,102,.02)':'');

    /* Section header bar */
    const sectionName=h1.textContent.trim();
    const headerBar=document.createElement('div');
    headerBar.style.cssText='display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;background:'+(isActive?'rgba(0,152,102,.05)':'var(--bg)')+';border-bottom:'+(isActive?'1px solid rgba(0,152,102,.15)':'1px solid transparent')+';transition:all .2s;';
    headerBar.onmouseover=function(){if(!isActive)this.style.background='rgba(0,152,102,.03)';};
    headerBar.onmouseout=function(){if(!isActive)this.style.background='var(--bg)';};

    const secNum=idx;
    headerBar.innerHTML=
      '<span style="font-size:.7rem;color:'+(isActive?'var(--g2)':'var(--muted)')+';">'+(isActive?'\u25BC':'\u25B6')+'</span>'+
      '<span style="font-weight:700;font-size:.88rem;flex:1;color:var(--g3)">'+sectionName+'</span>'+
      '<button onclick="event.stopPropagation();toggleSectionEdit('+secNum+')" style="font-size:.7rem;padding:4px 10px;border-radius:6px;border:1px solid '+(isEditing?'var(--g2)':'var(--border)')+';background:'+(isEditing?'rgba(0,152,102,.1)':'#fff')+';cursor:pointer;color:'+(isEditing?'var(--g3)':'var(--muted)')+';display:flex;align-items:center;gap:4px" title="Edit this section">\u270F\uFE0F '+(isEditing?'Editing':'Edit')+'</button>'+
      '<button onclick="event.stopPropagation();window.editorAdaChat=true;window.editorActiveSection='+secNum+';navigate(\'protocol\');toast(\'Ada: How can I help with '+sectionName.replace(/'/g,"\\'")+'?\')" style="font-size:.7rem;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:4px" title="Ask Ada about this section">\uD83E\uDD16 Ada</button>'+
      '<button onclick="event.stopPropagation();toast(\'Adding comment to '+sectionName.replace(/'/g,"\\'")+'...\')" style="font-size:.7rem;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--muted)" title="Add comment">\uD83D\uDCAC</button>'+
      '<button onclick="event.stopPropagation();toast(\'Version history for '+sectionName.replace(/'/g,"\\'")+'...\')" style="font-size:.7rem;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--muted)" title="View history">\uD83D\uDD52</button>';
    headerBar.onclick=function(){setEditorSection(secNum);};

    /* Content area */
    const contentDiv=document.createElement('div');
    contentDiv.style.cssText='padding:'+(isActive?'16px 20px':'0 20px')+';max-height:'+(isActive?'5000px':'0')+';overflow:hidden;transition:max-height .3s ease, padding .3s ease;';

    if(isEditing && isActive){
      /* Build editable textarea from section content */
      let textContent='';
      sectionContent.forEach(el=>{textContent+=el.textContent.trim()+'\\n\\n';});
      const editArea=document.createElement('div');
      editArea.innerHTML=
        '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">'+
          '<button class="btn btn-s" style="font-size:.65rem;padding:3px 10px;border-radius:10px" onclick="toast(\'Ada: Rewriting section with improved language...\')">Ada: Rewrite</button>'+
          '<button class="btn btn-s" style="font-size:.65rem;padding:3px 10px;border-radius:10px" onclick="toast(\'Ada: Checking compliance...\')">Ada: Check Compliance</button>'+
          '<button class="btn btn-s" style="font-size:.65rem;padding:3px 10px;border-radius:10px" onclick="toast(\'Ada: Suggesting content for empty fields...\')">Ada: Fill Blanks</button>'+
          '<button class="btn btn-s" style="font-size:.65rem;padding:3px 10px;border-radius:10px" onclick="toast(\'Ada: Comparing to similar past protocols...\')">Ada: Compare to Past</button>'+
        '</div>';
      contentDiv.appendChild(editArea);
      /* Still show original content but with edit overlay hint */
      sectionContent.forEach(el=>{
        const clone=el.cloneNode(true);
        clone.style.cursor='text';
        clone.setAttribute('contenteditable','true');
        clone.style.outline='none';
        clone.style.borderRadius='4px';
        clone.style.transition='background .15s';
        clone.addEventListener('focus',function(){this.style.background='rgba(0,152,102,.04)';this.style.boxShadow='0 0 0 2px rgba(0,152,102,.2)';});
        clone.addEventListener('blur',function(){this.style.background='';this.style.boxShadow='';});
        contentDiv.appendChild(clone);
      });
      const saveBar=document.createElement('div');
      saveBar.style.cssText='display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)';
      saveBar.innerHTML=
        '<button class="btn btn-p" style="font-size:.72rem;padding:6px 14px" onclick="saveSectionEdits('+secNum+')">Save Changes</button>'+
        '<button class="btn btn-s" style="font-size:.72rem;padding:6px 14px" onclick="toggleSectionEdit('+secNum+')">Cancel</button>'+
        '<span style="font-size:.66rem;color:var(--muted);display:flex;align-items:center;margin-left:auto">\uD83D\uDD12 Saved to backend with audit trail</span>';
      contentDiv.appendChild(saveBar);
    } else {
      sectionContent.forEach(el=>{contentDiv.appendChild(el);});
    }

    /* Insert wrapper */
    h1.parentNode.insertBefore(wrapper,h1);
    wrapper.appendChild(headerBar);
    wrapper.appendChild(contentDiv);
    h1.style.display='none';
  });
  /* Also handle Cover Page (ps0) which is a div, not h1 */
  const cover=document.getElementById('ps0');
  if(cover && !cover.dataset.wrapped){
    cover.dataset.wrapped='1';
    cover.style.cssText+='cursor:default;';
  }
}
