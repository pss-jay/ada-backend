# Ada Platform - Nginx Reverse Proxy Configuration
# Proxies requests from port 80/443 to the Python backend on port 8000.

# Rate limiting zone: 100 requests/minute per IP
limit_req_zone $binary_remote_addr zone=ada_api:10m rate=100r/m;

upstream ada_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Max upload size (for SOW PDFs)
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check (no rate limit, no logging)
    location = /api/health {
        proxy_pass http://ada_backend;
        access_log off;
    }

    # API endpoints
    location /api/ {
        limit_req zone=ada_api burst=20 nodelay;

        proxy_pass http://ada_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Extraction can take 2-3 minutes with large SOWs
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Frontend (static HTML)
    location / {
        proxy_pass http://ada_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

